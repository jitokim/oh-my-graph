# adr-driven-dev — the heavyweight, design-first delivery pipeline: write and
# deep-review the design BEFORE any code, then make the code survive three
# review rounds (deep → standard → deep fresh-eyes) before a draft PR.
#
#   adr ─▶ adr-review ─▶ adr-apply ─▶ impl ─▶ localrun
#    ─▶ round1 ─▶ apply1 ─▶ round2 ─▶ apply2 ─▶ round3 ─▶ finalize
#
# When to use this vs dev-review-pr:
#   - dev-review-pr is the everyday pipeline: implement, e2e, two one-shot
#     parallel reviews, PR. Use it for routine, well-understood changes.
#   - adr-driven-dev is for changes where the DESIGN decision matters more
#     than the diff — new subsystems, invariant changes, anything you would
#     write an ADR for anyway. The design is reviewed and fixed before a
#     line of implementation exists, and the code then earns its PR through
#     three review/apply rounds.
#   - Cost, honestly: eleven claude sessions (three of them deep,
#     opus-class if your agent maps there) plus four `make local` runs —
#     expect roughly 3–5x the usage of dev-review-pr per task. Do not
#     reach for it on routine work.
#
# The `agent:` slot on the three DEEP rounds (adr-review, round1, round3):
#   The agent: field is NOT {{ inputs }}-interpolated (only prompt, cwd and
#   verify command/cwd are), so this template has to ship a concrete name.
#   SET `code-reviewer-deep` BELOW TO YOUR OWN DEEP-REVIEW AGENT — one whose
#   model is opus-class — from ~/.claude/agents or <repo>/.claude/agents.
#   A name that does not resolve on your machine fails the node LOUDLY at
#   run time; it never silently falls back to plain claude. If you have no
#   such agent, delete the three `agent:` lines and those rounds run as
#   plain claude sessions (auto mode's agent mapping, #81, applies to
#   auto-planned graphs, not to this hand-written file).
#
# One-direction discipline, kept throughout: review rounds never edit
# (permission_mode: plan, no write tools); apply nodes never re-review.
# Every apply gates on tests green — its own PASS claim plus a verify
# command the engine runs itself. `make local` is this repo's convention;
# adjust the verify commands to your project's equivalent.
#
# Run:
#   oh-my-graph run graphs/adr-driven-dev.yaml \
#     --input repo=/path/to/your/repo \
#     --input task="what to build, in one or two sentences"
name: adr-driven-dev
version: "0.1"
inputs: [repo, task]
concurrency: 1 # the flow is a strict chain — nothing ever runs in parallel
nodes:
  - id: adr
    type: claude-run
    cwd: "{{ inputs.repo }}"
    prompt: |
      Task: {{ inputs.task }}

      Write (or finalize, if a draft exists) an ADR for this task in the
      project's ADR location (docs/adr/ or its equivalent), following the
      house ADR style if the repo has one. Cover the context, the decision,
      the alternatives considered and why they lost, and the failure modes
      and compatibility consequences. No implementation code yet — the ADR
      comes first. Commit the ADR, ending the commit message with the trailer
      `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>` (the attribution
      convention in CONTRIBUTING.md).
      Write and commit it BEFORE you reply: your FINAL reply IS the verdict,
      so an ADR you promise to finish afterwards is never finished. START your
      reply with the bare token ADR followed immediately by the committed
      file's path (`ADR docs/adr/0014-thing.md`) — those characters FIRST, no
      markdown emphasis (`**ADR**` is WRONG), no heading, no preamble — then a
      one-line summary of the decision.
    allowed_tools: [Read, Grep, Glob, Edit, Write, "Bash(git *)"]
    permission_mode: dontAsk
    timeout: 30m
    handoff: artifact
    # The path is the payload: a node that only planned an ADR has no file to
    # name. Anchored and markdown-tolerant (DESIGN.md "Verdict patterns").
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*ADR[*_`\s:]*\S' }

  - id: adr-review
    type: claude-run
    depends_on: [adr]
    agent: code-reviewer-deep # ← YOUR deep-review agent (opus-class) — see header
    cwd: "{{ inputs.repo }}"
    prompt: |
      Deep-review the ADR just written for this task. The author reported:
      {{ artifacts.adr | inline }}

      Judge design fitness, not wording: does the decision actually solve
      the task ({{ inputs.task }})? Were the right alternatives weighed?
      What failure modes, migration or compatibility consequences, or
      simpler designs did it miss? If you have a code-review or
      coding-rules skill, apply it. This is a review round: do NOT edit
      anything.
      Finish the review BEFORE you reply. Your FINAL reply IS the verdict:
      the node's turn ends the moment you reply, so a question you promise
      to look into afterwards is never looked into. START the reply with
      exactly one of these two bare tokens, as the very FIRST characters,
      with no markdown emphasis (`**CLEAN**` is WRONG), no heading, no
      preamble:
        - CLEAN — you judged the whole ADR and have no design concerns.
        - FINDINGS: — followed by a prioritized list, worst first.
    allowed_tools: [Read, Grep, Glob, "Bash(git *)"]
    permission_mode: plan
    timeout: 30m
    handoff: artifact
    # Either verdict passes; an interim "still reading the ADR" does not.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*(FINDINGS[*_`\s]*:|CLEAN)' }

  - id: adr-apply
    type: claude-run
    depends_on: [adr-review]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Apply this design feedback to the ADR — before any code exists:
      {{ artifacts.adr-review | inline }}

      Address every finding: incorporate it, or record in the ADR why it
      was rejected. Commit the updated ADR, ending the commit message with
      the trailer `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>`
      (the attribution convention in CONTRIBUTING.md).
      Every finding must be handled BEFORE you reply: your FINAL reply IS
      the verdict, so a finding you promise to address afterwards is never
      addressed. When the updated ADR is committed, START your reply with
      the bare word DONE — those four characters FIRST, no markdown
      emphasis (`**DONE**` is WRONG), no heading, no preamble — then a
      one-line summary of what changed. If findings remain unhandled, do
      NOT write DONE: start with a bare BLOCKED and which ones.
    allowed_tools: [Read, Edit, Write, "Bash(git *)"]
    permission_mode: dontAsk
    handoff: artifact
    # Anchored, markdown-tolerant (DESIGN.md "Verdict patterns"): the code
    # rounds below all gate on a verdict, and the design round must too.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*DONE' }

  - id: impl
    type: claude-run
    depends_on: [adr-apply]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Implement the ADR this branch just finalized (task: {{ inputs.task }}).
      Write the implementation AND its tests — success and failure cases
      (invalid params, early exits, error paths), not just the happy path —
      and run the tests locally until green. Choose a commit granularity
      that fits the work — one commit per refactoring unit for refactors,
      per file for sweeps, per feature slice for new code — and state your
      choice in the first commit message. Commit as you go: a node timeout
      must never lose finished work. End every commit message with the
      trailer `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>` (the
      attribution convention in CONTRIBUTING.md). Run the tests
      SYNCHRONOUSLY and wait for them to finish — never in the background.
      Your FINAL reply is the verdict: never end the turn on an interim
      report. When tests are green, START the reply with the bare word PASS —
      those four characters FIRST, no markdown emphasis (`**PASS**` is
      WRONG), no heading, no preamble — then a one-line summary. Otherwise
      start it with a bare FAIL and what is broken.
    allowed_tools: [Read, Grep, Glob, Edit, Write, "Bash(git *)", "Bash(make *)"]
    permission_mode: dontAsk
    timeout: 1h # hang guard — generous, so real work is never killed mid-flight
    handoff: artifact
    # Anchored so a FAIL report mentioning the word cannot pass, and tolerant
    # of the leading markdown emphasis a model adds unbidden.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*PASS' }

  - id: localrun
    type: claude-run
    depends_on: [impl]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Run the project's real local execution beyond unit tests — `make
      local` here, or the project's closest equivalent — and exercise the
      new behavior end to end. If the diff touches concurrency-sensitive
      code, also stress its tests (`go test <affected packages> -race
      -count=300`, or your stack's equivalent). Run every check
      SYNCHRONOUSLY and wait for it to finish — never in the background.
      Your FINAL reply is the verdict: never end the turn on an interim
      report. START it with the bare word PASS, or with a bare FAIL and the
      failing step — the verdict word must be the very FIRST characters of
      the reply, with no markdown emphasis (`**PASS**` is WRONG), no
      heading, no preamble.
    allowed_tools: [Read, "Bash(make *)", "Bash(git *)"]
    permission_mode: dontAsk
    # Runaway insurance ONLY, never cost tuning — keep this an order of
    # magnitude above a plausible run, or omit it. The hang guard is
    # `timeout:`, not the budget.
    budget_usd: 10.00
    handoff: artifact
    success_check:
      exit_zero: true
      # Secondary: the node's own account of itself. Anchored (prose that
      # merely mentions the word must not pass) but tolerant of the leading
      # markdown emphasis a model adds unbidden — `**PASS**` has halted a
      # real run.
      result_matches: '^[*_`\s]*PASS'
      # The evidence. The engine runs this itself and judges the exit code,
      # so a node that reports PASS without the suite passing does not pass.
      verify: { command: "make local", timeout: 5m }
    retry: { max: 1, on: [nonzero_exit, verify_failed] }

  - id: round1
    type: claude-run
    depends_on: [localrun]
    agent: code-reviewer-deep # ← YOUR deep-review agent (opus-class) — see header
    cwd: "{{ inputs.repo }}"
    prompt: |
      Deep-review the WHOLE diff for this task (git diff against the base
      branch, git log for the commit story). Judge three things:
        - design fitness: does the implementation match the ADR, and does
          the ADR's design survive contact with the real code?
        - test coverage: are edge and failure cases genuinely covered, or
          only the happy path?
        - hidden bugs: races, error paths, resource leaks, boundary
          conditions.
      If you have a code-review or coding-rules skill, apply it. This is a
      review round: do NOT edit anything.
      Finish the review BEFORE you reply. Your FINAL reply IS the verdict:
      the node's turn ends the moment you reply, so a file you promise to
      read afterwards is never read. START the reply with exactly one of
      these two bare tokens, as the very FIRST characters, with no markdown
      emphasis (`**CLEAN**` is WRONG), no heading, no preamble:
        - CLEAN — you judged the whole diff and found nothing.
        - FINDINGS: — followed by a prioritized list, worst first.
    allowed_tools: [Read, Grep, Glob, "Bash(git *)"]
    permission_mode: plan
    timeout: 30m
    handoff: artifact
    # Either verdict passes; an interim "still reviewing" does not.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*(FINDINGS[*_`\s]*:|CLEAN)' }

  - id: apply1
    type: claude-run
    depends_on: [round1]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Apply this deep-review feedback:
      {{ artifacts.round1 | inline }}

      Address every finding — fix it, or commit a note explaining why it
      is wrong. Update the tests to cover what the review exposed, and run
      them until green. This is an apply round: do NOT re-review. Commit
      as you go, ending every commit message with the trailer
      `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>` (the
      attribution convention in CONTRIBUTING.md). Run the tests
      SYNCHRONOUSLY and wait for them to finish — never in the background.
      Your FINAL reply is the verdict: never end the turn on an interim
      report. When tests are green, START the reply with the bare word PASS —
      those four characters FIRST, no markdown emphasis (`**PASS**` is
      WRONG), no heading, no preamble. Otherwise start it with a bare FAIL
      and what is broken.
    allowed_tools: [Read, Grep, Glob, Edit, Write, "Bash(git *)", "Bash(make *)"]
    permission_mode: dontAsk
    timeout: 45m
    handoff: artifact
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s]*PASS' # anchored, but tolerant of `**PASS**`
      verify: { command: "make local", timeout: 5m }
    retry: { max: 1, on: [nonzero_exit, verify_failed] }

  - id: round2
    type: claude-run
    depends_on: [apply1]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Standard review of the current diff: style, naming, simplicity,
      docstring and comment drift, dead code, obvious correctness issues.
      If you have a code-review or coding-rules skill, apply it. This is a
      review round: do NOT edit anything.
      Finish the review BEFORE you reply. Your FINAL reply IS the verdict:
      the node's turn ends the moment you reply, so a file you promise to
      read afterwards is never read. START the reply with exactly one of
      these two bare tokens, as the very FIRST characters, with no markdown
      emphasis (`**CLEAN**` is WRONG), no heading, no preamble:
        - CLEAN — you judged the whole diff and found no issues.
        - FINDINGS: — followed by a short list, worst first.
    allowed_tools: [Read, Grep, Glob, "Bash(git *)"]
    permission_mode: plan
    handoff: artifact
    # Either verdict passes; an interim "still reviewing" does not.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*(FINDINGS[*_`\s]*:|CLEAN)' }

  - id: apply2
    type: claude-run
    depends_on: [round2]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Apply this review feedback:
      {{ artifacts.round2 | inline }}

      Address every finding — fix it, or commit a note explaining why it
      is wrong. Keep the tests updated and green. This is an apply round:
      do NOT re-review. Commit as you go, ending every commit message with
      the trailer `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>`
      (the attribution convention in CONTRIBUTING.md). Run the tests
      SYNCHRONOUSLY and wait for them to finish — never in the background.
      Your FINAL reply is the verdict: never end the turn on an interim
      report. When tests are green, START the reply with the bare word PASS —
      those four characters FIRST, no markdown emphasis (`**PASS**` is
      WRONG), no heading, no preamble. Otherwise start it with a bare FAIL
      and what is broken.
    allowed_tools: [Read, Grep, Glob, Edit, Write, "Bash(git *)", "Bash(make *)"]
    permission_mode: dontAsk
    timeout: 45m
    handoff: artifact
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s]*PASS' # anchored, but tolerant of `**PASS**`
      verify: { command: "make local", timeout: 5m }
    retry: { max: 1, on: [nonzero_exit, verify_failed] }

  - id: round3
    type: claude-run
    depends_on: [apply2]
    agent: code-reviewer-deep # ← YOUR deep-review agent (opus-class) — see header
    cwd: "{{ inputs.repo }}"
    prompt: |
      Final deep review — fresh eyes on the FINAL state, not the history.
      Read the code as it now stands and judge: does it fit the purpose
      the ADR states (task: {{ inputs.task }})? Are edge and failure cases
      genuinely covered by the tests, or only nominally? Would you merge
      this? If you have a code-review or coding-rules skill, apply it.
      This is a review round: do NOT edit anything.
      Finish the review BEFORE you reply. Your FINAL reply IS the verdict:
      the node's turn ends the moment you reply, so a file you promise to
      read afterwards is never read. START the reply with exactly one of
      these two bare tokens, as the very FIRST characters, with no markdown
      emphasis (`**CLEAN**` is WRONG), no heading, no preamble:
        - CLEAN — you would merge this as it stands; no flags remain.
        - FINDINGS: — followed by the remaining flags, worst first.
    allowed_tools: [Read, Grep, Glob, "Bash(git *)"]
    permission_mode: plan
    timeout: 30m
    handoff: artifact
    # Either verdict passes; an interim "still reviewing" does not.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*(FINDINGS[*_`\s]*:|CLEAN)' }

  - id: finalize
    type: claude-run
    depends_on: [round3]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Final review verdict:
      {{ artifacts.round3 | inline }}

      Apply any remaining flags (small fixes only — a big finding at this
      stage means another round, done manually), keep the tests green, and
      end any commit message with the trailer
      `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>` (the
      attribution convention in CONTRIBUTING.md). Then push the branch and
      open a DRAFT pull request whose body summarizes the ADR decision,
      the implementation, and the three review rounds.
      Open it BEFORE you reply: your FINAL reply IS the verdict, so a PR
      you promise to open afterwards is never opened. START your reply with
      the bare token PR followed immediately by the pull request's URL
      (`PR https://github.com/owner/repo/pull/123`) — those characters
      FIRST, with no markdown emphasis (`**PR**` is WRONG), no heading, no
      preamble.
    allowed_tools: [Read, Edit, Write, "Bash(git *)", "Bash(gh *)", "Bash(make *)"]
    permission_mode: dontAsk
    timeout: 30m
    handoff: artifact
    success_check:
      exit_zero: true
      # The URL is the payload that makes this an assertion: gh prints one
      # only once the PR exists. Without it the last node of the pipeline
      # passed on a promise, which is how merge-shepherd's merge node once
      # ended a run green with nothing merged.
      result_matches: '^[*_`\s]*PR[*_`\s:]*https?://\S'
      verify: { command: "make local", timeout: 5m }
