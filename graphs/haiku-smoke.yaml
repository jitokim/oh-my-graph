# haiku-smoke — the cheapest real-claude smoke test (a few cents).
#
# Two nodes, one artifact edge:
#   write     — writes a 3-line haiku to haiku.txt (acceptEdits, may edit files)
#   critique  — reads the written file via the artifact handoff, plan mode (read-only)
#
# Proves, end to end: subscription auth works with the API key scrubbed,
# a sequential edge with artifact handoff, JSON capture (two session_ids +
# costs), the RunLedger table, that both nodes stay readable afterwards as
# ordinary claude sessions under ~/.claude/projects, and that
# success_check.verify really runs a command and judges it (the `write` node
# passes only if haiku.txt actually exists — saying DONE is not enough).
#
# Run it manually (never in CI):
#   mkdir -p /tmp/omg-smoke
#   oh-my-graph run graphs/haiku-smoke.yaml --input dir=/tmp/omg-smoke
name: haiku-smoke
version: "0.1"
inputs: [dir]
concurrency: 1
nodes:
  - id: write
    type: claude-run
    cwd: "{{ inputs.dir }}"
    prompt: |
      Write a 3-line haiku about directed graphs to a file named haiku.txt
      in the current directory. Then your reply is exactly the four bare
      characters DONE and nothing else — no markdown emphasis (`**DONE**`
      is WRONG), no heading, no backticks, no preamble.
    allowed_tools: [Read, Write, "Bash(cat *)"]
    permission_mode: acceptEdits
    handoff: artifact
    success_check:
      exit_zero: true
      # What the node SAID. Anchored at both ends so "I could not write the
      # file, so I am not DONE" cannot read as a pass — tolerant of the
      # markdown a model adds unbidden (see DESIGN.md "Verdict patterns").
      result_matches: '^[*_`\s]*DONE[*_`\s]*$'
      # …and what the engine SAW. The file either exists in the node's cwd or it
      # does not; no wording in the reply can satisfy this one.
      verify: { command: "test -f haiku.txt", timeout: 10s }

  - id: critique
    type: claude-run
    depends_on: [write]
    cwd: "{{ inputs.dir }}"
    prompt: |
      A haiku was written in this directory (the writer reported: {{ artifacts.write | inline }}).
      Read haiku.txt and give a one-paragraph critique of its imagery.
      Do not modify any files.
    allowed_tools: [Read]
    permission_mode: plan
    handoff: artifact
    success_check: { exit_zero: true }
