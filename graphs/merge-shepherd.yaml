# merge-shepherd — the operator's PR-shipping loop as a graph.
#
#   verify ─▶ ready-and-wait ─▶ triage ─▶ recheck ─▶ stack-scan ─▶
#   stack-retarget ─▶ approve-merge ─▶ merge
#                          (gate)
#
# What this replaces: the loop the human operator runs by hand on every PR —
# fetch the head, `make local` in a scratch checkout, mark the PR ready, wait
# for CI and CodeRabbit, work through the review comments, wait out the checks
# your own fix restarted, merge, pull, rebuild, prune. Same steps, same order,
# pinned in YAML — with the merge policy encoded in the graph shape itself:
# merge happens only AFTER the review is settled over EVERY reviewer, bot and
# human. GitHub's own `reviewDecision` counts them all, but it is PR-LEVEL and
# never scoped to a SHA — and a COMMENTED review does not clear a
# CHANGES_REQUESTED — so it stays set over a review a later push superseded,
# and the graph reads the reviews themselves rather than that one field. No
# reviewer other than the bot may hold an OPEN request for changes (a person's
# does not clear on a push: only that reviewer approving, or a maintainer
# dismissing it, clears one), CodeRabbit's LATEST review on the SHA being
# merged is not one, every comment it had made when triage ran is actioned,
# and `--admin` is
# never a way past an unfinished review (it may only grease merge-queue
# mechanics once the review is complete — see CONTRIBUTING). Note the seam that
# wording leaves, because the graph does not close it: an incremental review of
# triage's OWN fix that merely COMMENTS passes recheck untriaged, since there is
# no arc back to triage. Its notes reach the operator at the gate and nowhere
# else.
#
# Clean tree required: verify and merge run `git`/`make` inside the repo you
# point at. The PR itself is only ever touched through THROWAWAY worktrees
# (`git worktree add /tmp/shepherd-... FETCH_HEAD` — plain git run by the
# node via Bash, not the engine's `worktree:` seam, which branches from the
# invocation repo's HEAD rather than the PR head this graph needs).
#
# Honest note on the two waits: ready-and-wait and recheck are POLLS under a
# timeout, not event subscriptions — `sleep 30` loops between `gh pr view`
# reads, in the FOREGROUND, bounded by each node's own timeout. A node's final
# reply is its verdict, so nothing may be backgrounded: a node that kicks off a
# polling loop and reports "will follow up" has already ended its turn, and
# success_check sees the interim report instead of the verdict. The two waits
# differ only in what an unfinished wait means. ready-and-wait waits BEFORE any
# fix exists, so not-yet-concluded is a plain failure — it reports the actual
# state as NOT READY, fails its READY check, and the operator decides. recheck
# waits AFTER triage may have pushed, where the whole run is already paid for,
# so its timeout is a third verdict rather than a failure; see its own comment.
#
# A poll is only honest over a SELF-RESOLVING condition — one a machine that is
# already working will clear with nobody doing anything: a check run
# IN_PROGRESS, a status context PENDING with a reporter behind it, a
# mergeability GitHub has not finished computing. The other kind is LATCHED:
# the clock will never clear it, because what clears it is an ACT by a person —
# a review that requested changes, a workflow run awaiting a maintainer's
# approval, a required context nobody reports, a branch that conflicts with its
# base, a bot that will not review again until it is asked. Waiting out a latch
# spends the whole timeout to learn nothing and then reports the latch as if it
# were slowness. So both waits CLASSIFY before they poll, and a latch gets a
# verdict that names the act rather than a polling budget: the token is
# `LATCHED` at both nodes, it carries `unblock:` and the act, and it FAILS, so
# the run halts and the operator reads what to do in the node's own artifact
# (`<run-id>/failed/<node>.out`). ADR 0021 is the rule. `gh pr ready` in
# ready-and-wait's own step 1 is this graph's oldest instance of it: a DRAFT PR
# is a latch, and the graph has always acted on that one instead of waiting.
#
# What the waits look AT, and the keyhole that was widened on 2026-08-11. Both
# waits used to model "is this PR ready" as ONE BOT'S OPINION plus a check
# rollup: recheck filtered `reviews` down to `coderabbitai` and read neither
# `reviewDecision` nor `mergeStateStatus` — the two fields GitHub computes for
# exactly this question. A HUMAN reviewer's CHANGES_REQUESTED was therefore
# invisible to the entire chain: ready-and-wait's condition never mentioned it,
# recheck filtered it out and answered RECHECKED, the gate comment told the
# operator that review status was no longer theirs to confirm, and merge held a
# licence to `--admin` justified by a review that was "complete by
# construction" — a construction with no human in it. Not a hang: a MERGE. A
# conflicting PR was invisible the same way and ended the run green, because
# merge met the conflict, answered WITHHELD, and WITHHELD passes. Both waits now
# project EVERY review with its author, read `reviewDecision` and
# `mergeStateStatus` alongside them, and judge the WHOLE check
# rollup instead of an entry named `test`. The unfiltered review list is what
# does the work: `reviewDecision` is reported, not judged by, because it is
# PR-level and one word for two different latches — the bot's, which a
# re-request clears, and a person's, which only that person or a maintainer
# does. See ADR 0019's 2026-08-11 update for
# how that keyhole, and not the latch story alone, is what ties the incidents
# together.
#
# The merge verdict is two-valued on purpose: MERGED <sha> or WITHHELD
# <reason>. A deliberate refusal to merge PASSES — refusing to go past an
# unfinished review is this graph working, not failing — so a green run is
# not by itself proof that anything landed. Read merge's artifact. WITHHELD is
# a FALLBACK, not the routine answer to pending checks: recheck is what waits
# for those now, and merge reaches WITHHELD only when recheck came back
# UNSETTLED and the operator approved the gate anyway. Say the trade plainly:
# the checks-outlast-the-wait case ends GREEN having merged nothing — UNSETTLED
# passes and merge answers WITHHELD — and it ended green before recheck too,
# because WITHHELD was then the ROUTINE answer to a review triage's own push had
# restarted, and WITHHELD passes. Three of the five observed hits ended exactly
# that way (see the recheck comment). So this node does not turn a red
# terminal state green; it makes that state RARER — the common case, a fix
# pushed and checks that restart and conclude in minutes, now merges where it
# used to withhold — and VISIBLE, since recheck names the SHA and the pending
# entry before the gate instead of merge discovering it after. What must never
# pass is
# the third thing a model writes: a promise to merge later. That reply once
# ended a real run of this graph green with nothing merged, and the only reason
# the operator noticed was that `git pull` did not move.
#
# The mirror failure has happened too, and it is fixed on the OTHER side. Run
# 20260807-144514 merged PR #135 for real, opened its reply with one line of
# housekeeping ("no local branch to delete"), put `MERGED 83edfad…` on the
# next line, and was recorded FAIL. The verdict still anchors at the start of
# the REPLY, not of a line: a line anchor lets the promise straight back in,
# because a model can put `MERGED <7 hex>` on a line of a plan — the example
# in this very prompt is seven hex characters — long before anything merges.
# What changed instead is what that false FAIL costs. Step 0 below, plus two
# read-only commands in this node's grant, let a re-run SEE that the PR is
# already merged and report it, so correcting a false FAIL here is the same
# free re-run it is at every other node. See the success_check comment below
# and ADR 0019.
#
# What `--delete-branch` does to a PR stacked on THIS one, and why two nodes
# now run before the gate. PR #207 merged with `--delete-branch` at
# 2026-08-20T23:48:35Z. PR #211's base was `docs/drift-audit-v0.10` — #207's
# HEAD branch, not `main` — so GitHub deleted the base out from under it and
# closed it two seconds later, at 23:48:37Z. That state is UNRECOVERABLE by
# API: a closed PR whose base branch is gone refuses both calls that would
# undo it ("Cannot change the base branch of a closed pull request", "Could
# not open the pull request"). The work survived only because the head branch
# outlived the base and somebody noticed #211 had dropped out of `gh pr list`;
# it was recovered by hand as #223. The ASYMMETRY is what decides the design,
# because the other error is cheap: retargeting a child that did not need it
# leaves a conflict in the child that a person resolves — exactly what #211
# and #212 needed anyway. So `stack-scan` reads who is standing on this PR's
# head branch, `stack-retarget` moves them onto this PR's own base, and both
# run BEFORE the gate rather than after the approval, because the window
# closes at the instant of MERGE and a gate is asynchronous — a human may take
# hours. Approval governs the merge, not the rescue; the graph moves the
# children while it still can and then TELLS the human what it moved. And
# `--delete-branch` stops being unconditional: merge applies it only when
# nothing open is based on this head any more, and names the child that held
# it back when something is.
#
# Only DIRECT children move, and they move ONE LINK, to this PR's base. A
# grandchild stays based on its parent, whose head branch still exists and
# whose PR is still open, so a chain of three shifts up by one and stays
# intact. Flattening a grandchild onto this PR's base would drag in commits it
# does not have and manufacture conflicts nobody asked for. The NEXT LINK is
# reported at the gate instead — reported, not counted, because the scan reads
# one link down and "there is another link" is precisely what tells the
# operator that the next run of this graph has the same job one PR down.
#
# The run pauses at the approve-merge gate (exit 2). Read triage's table and
# recheck's verdict — which names the SHA it judged — then resume:
#   oh-my-graph resume <run-id> --approve approve-merge
#
# Run (against a clean tree):
#   oh-my-graph run graphs/merge-shepherd.yaml \
#     --input repo=/path/to/repo \
#     --input pr=123
name: merge-shepherd
version: "0.1"
inputs: [repo, pr]
concurrency: 1 # the flow is a strict chain — nothing ever runs in parallel
nodes:
  - id: verify
    type: claude-run
    cwd: "{{ inputs.repo }}"
    prompt: |
      You are in the repo at {{ inputs.repo }}; its working tree is clean and
      must stay untouched. Verify that PR #{{ inputs.pr }} passes the local
      suite, in a throwaway checkout:
        0. Clear any leftover from an earlier attempt so a retry cannot
           collide: `git worktree remove --force /tmp/shepherd-{{ inputs.pr }}`
           (ignore the error if there is nothing to remove).
        1. `gh pr view {{ inputs.pr }}` and `gh pr diff {{ inputs.pr }}` to
           see what the PR is.
        2. `git fetch origin pull/{{ inputs.pr }}/head`
        3. `git worktree add /tmp/shepherd-{{ inputs.pr }} FETCH_HEAD`
        4. `make -C /tmp/shepherd-{{ inputs.pr }} local` — run it
           SYNCHRONOUSLY and wait for the exit code, never in the
           background: your final reply IS the verdict, so you cannot reply
           before the suite has finished.
        5. ALWAYS remove the worktree before you answer, on the FAIL path
           as well as the PASS path:
           `git worktree remove --force /tmp/shepherd-{{ inputs.pr }}`
      Your reply must START with the bare word PASS — those four characters
      as the very FIRST characters of the reply, with no markdown emphasis
      (`**PASS**` is WRONG), no heading, no backticks, no preamble — or with
      a bare FAIL followed by the failing step.
      Anything you need to qualify — a step that had nothing to do, a
      caveat, a note — goes AFTER the verdict, never before it: a line of
      context ahead of the token fails this node even when the work is done.
    allowed_tools: [Read, "Bash(gh *)", "Bash(git *)", "Bash(make *)"]
    permission_mode: dontAsk
    timeout: 30m
    handoff: artifact
    # Anchored so a FAIL report that merely mentions the word cannot pass,
    # and tolerant of leading markdown emphasis, which a model adds unbidden
    # (`**PASS**` halted a real run of this very graph).
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*PASS' }

  - id: ready-and-wait
    type: claude-run
    depends_on: [verify]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Local verify said: {{ artifacts.verify | inline }}.
      Mark PR #{{ inputs.pr }} ready for review: `gh pr ready {{ inputs.pr }}`.

      One read gives you everything, and it is the same read `recheck` makes
      later. Project it down to the fields the rules below use — the raw
      `reviews` and `comments` arrays carry every body, which is kilobytes of
      text per poll that no rule reads:
        gh pr view {{ inputs.pr }} \
          --json headRefOid,statusCheckRollup,reviewDecision,mergeStateStatus,reviews,comments \
          --jq '{head: .headRefOid,
                 review_decision: .reviewDecision,
                 merge_state: .mergeStateStatus,
                 checks: [.statusCheckRollup[] | {name: (.name // .context), status, conclusion, state}],
                 reviews: [.reviews[] | {who: .author.login, oid: .commit.oid,
                                         state, at: .submittedAt}],
                 last_bot_note: ([.comments[] | select(.author.login == "coderabbitai")] | last
                                 | {at: .createdAt,
                                    limited: ((.body // "") | test("review limit|rate limit"; "i")),
                                    excerpt: ((.body // "") | gsub("<!--[^>]*-->"; "")
                                              | (([scan("(?i).{0,40}(?:review limit|rate limit).{0,240}"; "m")] | first)
                                                 // (sub("^\\s+"; "") | .[0:240])))})}'

      `reviews` is EVERY reviewer's, not just the bot's — a human's
      CHANGES_REQUESTED is the one this graph used to be blind to, so the
      projection names `who`. The `excerpt` is the region AROUND the rate-limit
      phrase, not the head of the comment: the bot's notice sits ten lines
      under a walkthrough image, and the head of the body is that image.

      Read it, then `sleep 30`, then run it again — one loop iteration per
      tool call, blocking each time, in the FOREGROUND. NEVER background
      anything: no `&`, no `nohup`, no run_in_background, no "I'll keep
      polling and report back". Your FINAL reply IS the verdict, so you cannot
      reply until the poll has actually reached one — an interim report ends
      the node and fails it.

      READY means BOTH hold:
        - EVERY entry of `checks` is finished and good — `status` COMPLETED
          with `conclusion` SUCCESS, SKIPPED or NEUTRAL, or `state` SUCCESS.
          Judge the WHOLE rollup and NEVER one check by name: this graph runs
          against whatever repo you point it at, whose checks are named
          whatever they are named, and the repo it was written in carries
          three entries. A red one of the other two must not read as green.
        - coderabbitai has a COMPLETED review on the PR (a submitted review
          in `reviews`; a "review in progress" placeholder comment is not one).

      Before you poll, and again on EVERY read, classify what is missing.
      A condition is SELF-RESOLVING — poll it — when a machine already at work
      will clear it with nobody doing anything: a check run IN_PROGRESS, a
      status context PENDING, `merge_state` UNKNOWN (GitHub computes
      mergeability asynchronously), a "review in progress" placeholder.
      A condition is LATCHED when the clock will never clear it, because what
      clears it is an ACT by a person. Do not poll a latch; answer at once:
        - a `checks` entry finished and BAD (COMPLETED with FAILURE,
          CANCELLED, TIMED_OUT, STARTUP_FAILURE or STALE; or `state` FAILURE
          or ERROR) → read that job's log, fix and push.
        - a `checks` entry whose `conclusion` is ACTION_REQUIRED → approve the
          workflow run or deployment in the repo's Actions tab.
        - a reviewer OTHER than coderabbitai holds an OPEN request for changes
          — in `reviews`, that person's latest CHANGES_REQUESTED is not
          followed by an APPROVED from the SAME person → read that review. It
          clears only when that reviewer re-reviews with APPROVED or a
          maintainer dismisses it: a push does not clear one, a COMMENTED does
          not, and `triage` actions CodeRabbit's comments only, so nothing
          downstream of here clears it either. Name the person and the commit
          their review sits on.
          coderabbitai's OWN CHANGES_REQUESTED is NOT a latch: it is this
          graph's ordinary path, and `triage` is the node whose entire job is
          to action it. Every PR this graph has shepherded opened with exactly
          that review. Note what that means for `review_decision`, which is why
          this rule reads `reviews` instead: the field flips to
          CHANGES_REQUESTED at the very instant the bot submits one, which is
          the same instant the READY condition above is met, so gating on the
          field alone would halt the normal run before triage ever ran.
        - `merge_state` is DIRTY → the PR conflicts with its base: rebase or
          merge the base in, and push.
        - `last_bot_note.limited` is true AND `last_bot_note.at` is NEWER than
          the newest `at` in `reviews` — the bot's most recent word is that its
          review limit is reached, and `excerpt` carries that notice, which
          says "next review available in N minutes" → the clock opens the
          WINDOW, not the review: the operator waits the stated N minutes and
          then posts `@coderabbitai review` on the PR. Nothing arrives if
          nobody asks. If a review is NEWER than the note, the bot already
          reviewed past that limit and the note is spent — not a latch.
          (`limited` is a regex over the whole comment, so it can fire on a
          comment that merely discusses a rate limit. That costs the operator
          one glance; missing a real one costs the whole timeout, which is what
          happened on 2026-08-04.)
      Every act named in that list is the OPERATOR's, and you REPORT it — this
      graph does not resolve a review thread, re-request a review or sleep out
      a rate-limit window on its own judgement (ADR 0021 §3). Your grant is
      wide enough to do all three. Do not. `gh pr ready` in step 1 is the one
      act this node performs, and only because a DRAFT PR is its own
      precondition.
      Two conditions are only distinguishable by not moving — a `checks` entry
      stuck at QUEUED (a fork or first-contributor run awaiting approval) and
      no coderabbitai review at all. Poll those; if the budget runs out with
      them exactly as they started, they are LATCHED, not slow.

      Your reply must START with exactly one of these three verdicts — the
      token as the very FIRST characters, with no markdown emphasis
      (`**READY**` is WRONG), no heading, no backticks, no preamble:
        - READY — both conditions above hold; a one-line status after it.
        - LATCHED <what is stuck>; unblock: <the act> — a latch is present.
          Name the entry or the field, then the act from the list above, on
          that first line. This FAILS this node deliberately, so the run halts
          before anything is paid for triage.
        - NOT READY <what is still in flight> — the 15 minutes ran out with
          only self-resolving conditions outstanding; name the entry and its
          current status. This also FAILS; the difference from LATCHED is the
          only thing the operator has to read: NOT READY means re-run once it
          settles, LATCHED means do the named act first.
      LATCHED and NOT READY are two words for two different next actions. Do
      not write NOT READY over a latch — that is the mistake this grammar
      exists to stop, and it once spent fourteen minutes polling for a review
      a rate-limited bot was never going to submit.
      Anything you need to qualify — a check that had nothing to report, a
      caveat, a note — goes AFTER the verdict, never before it: a line of
      context ahead of the token fails this node even when both conditions
      hold.
      You have 15 minutes: as that timeout comes near (after ~20 loops), stop
      polling and answer from the state you actually have. NEVER reply READY
      early.
    allowed_tools: ["Bash(gh *)", "Bash(sleep *)"]
    permission_mode: dontAsk
    timeout: 15m
    handoff: artifact
    # Same shape as verify's: anchored, but tolerant of leading emphasis.
    # Three tokens, one of them in the pattern. LATCHED and NOT READY are both
    # written by the prompt and matched by nothing, which is how this graph
    # halts on purpose — the same shape as triage's BLOCKED. They are two
    # tokens rather than one because they are two different next actions, and
    # the operator must be able to tell them apart from the first word of the
    # artifact rather than from a paragraph inside it. Note that `NOT READY`
    # is rejected by POSITION, not by a negative rule: `N` is not in the
    # decoration class, so the anchor never reaches the `READY` inside it.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*READY' }

  - id: triage
    type: claude-run
    depends_on: [ready-and-wait]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Triage every CodeRabbit review comment on PR #{{ inputs.pr }}. List
      them all: `gh api repos/{owner}/{repo}/pulls/{{ inputs.pr }}/comments`
      plus the review bodies from `gh pr view {{ inputs.pr }} --json
      reviews`. If there are zero comments, reply `TRIAGED 0` and stop.
      For each comment, do exactly one of:
        - Mechanical and within the PR's scope → apply it. Build a fresh
          throwaway checkout of the PR head
          (`git fetch origin pull/{{ inputs.pr }}/head`, then
          `git worktree add /tmp/shepherd-triage-{{ inputs.pr }} FETCH_HEAD`),
          make the edit there, run the repo's checks
          (`make -C /tmp/shepherd-triage-{{ inputs.pr }} local` —
          SYNCHRONOUSLY, waiting for the exit code, never in the
          background), commit
          staging ONLY the files you changed by explicit path (`git add
          <path> ...` — never `git add -A`/`.`/`-u`), push to the PR's
          branch (`git push origin HEAD:<pr-branch>`), and remove the
          worktree when done.
        - You disagree, or it is out of the PR's scope → reply to that
          comment via `gh api` with a one-sentence reason.
      HARD limits: do NOT weaken or delete tests, and do NOT change
      behavior beyond what a comment literally asks — anything bigger is
      the operator's call, not this node's.
      Every comment must have been actioned BEFORE you reply. Your FINAL
      reply IS the verdict: this node's turn ends the moment you reply, so
      a comment you plan to get to afterwards is a comment nobody ever
      handles. Never end on "the rest to follow".
      The reply's FIRST LINE is the verdict and holds nothing else: the
      bare token TRIAGED, a space, and the number of comments you actioned
      — `TRIAGED 7`, or `TRIAGED 0` when the PR has none — then a NEWLINE.
      Those characters FIRST, with no markdown emphasis (`**TRIAGED**` is
      WRONG), no heading, no preamble, and nothing after the number on that
      line: not a unit, not a qualifier, not `of`. A count you have to
      qualify ("3 of 7 so far") is not a verdict, it is a progress report,
      and this node has no progress to report — only an outcome. The triage
      table starts on the SECOND line: one row per comment → the action
      taken (applied in <commit> / replied: <reason>).
      Anything you need to qualify goes in that table or below it, never
      above the first line: a line of context ahead of the token fails this
      node even when every comment was actioned. If you could not
      finish, do NOT write TRIAGED: start with a bare BLOCKED and what
      stopped you, so the run halts before the merge gate instead of
      passing it.
    allowed_tools: [Read, Edit, "Bash(gh *)", "Bash(git *)", "Bash(make *)"]
    permission_mode: dontAsk
    timeout: 45m
    handoff: artifact
    # The count is the payload — but a count alone is NOT the assertion the
    # node needs, because a partial count is still a count: `TRIAGED 3 of 7
    # so far — the rest to follow` is the very promise this exists to
    # reject, and it satisfies "TRIAGED then a digit". So the pattern pins
    # the whole FIRST LINE to token-and-number: the number must be followed
    # by a newline (or the end of the reply), which leaves nowhere to put
    # the "of 7 so far" that turns an outcome back into a progress report.
    # Hence the narrow trailing class — spaces and emphasis, deliberately
    # NOT `\s`, which would swallow the newline the pin depends on.
    # Anchored and markdown-tolerant (see DESIGN.md "Verdict patterns").
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*TRIAGED[*_`\s:]*[0-9]+[*_` \t]*(\n|$)' }

  # The re-wait, and why it is an ordinary node rather than a feedback arc.
  #
  # When triage pushes a fix, GitHub restarts the `test` check and sends
  # CodeRabbit back for an incremental review — both of which ready-and-wait
  # already waited out, on the SHA that push replaced. Without this node the
  # graph asks the human at the gate to perform the wait the graph exists to
  # perform, and the observed failure is not that the human refuses — it is
  # that `merge` meets the restarted check itself. Five runs between 2026-08-04
  # and 2026-08-08 hit it, and the loud shape was the rare one:
  #   - THREE times merge answered WITHHELD to the review this push restarted,
  #     which PASSES, so the run ended green having merged nothing —
  #     20260804-170325 (PR #111) and 20260807-154947 (PR #137), both on a
  #     re-review still PENDING on the triage commit; 20260807-144230 (PR #134),
  #     on a new CHANGES_REQUESTED against it.
  #   - ONCE it waited in the foreground instead, ran out of turn, and answered
  #     with a promise ("checks are still running ... waiting in the foreground
  #     until they conclude"), which the anchored verdict correctly rejected, so
  #     the run halted — 20260808-004132 (PR #137).
  #   - ONCE that same promise PASSED, because it predates the anchor: merge's
  #     success_check was `exit_zero` alone — 20260804-143531 (PR #107). That is
  #     the run the header's "git pull did not move" sentence is about.
  # Three of the five are therefore the quiet failure, not the halt: the graph
  # went green and shipped nothing.
  #
  # It cannot be a `feedback:` arc, for two independent reasons, both checked
  # against the code and not just the ADRs:
  #   - an arc fires only on a JUDGMENT FAILURE OF THE DECLARING NODE
  #     (`schedule.judgeFeedback` returns early unless `node.Feedback != nil`
  #     AND `isJudgmentFailure(cause)`; ADR 0010, "What fires the arc"). The
  #     thing that must re-open the wait is triage SUCCEEDING with a push —
  #     which is a PASS, and a PASS fires nothing.
  #   - load rule 4 forbids a gate anywhere in a loop body
  #     (`graph.validateFeedback`: `member.Type == TypeGate` is a
  #     GraphValidationError, because replaying a recorded decision on a later
  #     round would re-approve a round the human never saw). An arc declared on
  #     `merge` and aimed back before triage would pull approve-merge into the
  #     body, so the graph would not load at all.
  # A wait that must happen every time a fix lands is not failure recovery. It
  # is a step, so it is a node.
  #
  # Three verdicts, and the third is the reason this is not two. "Concluded
  # green" and "did not conclude" are not the whole space either, which is what
  # the 2026-08-11 revision of this node is about. The checks may still be
  # pending when the timeout runs out, and that outcome is neither a pass nor a
  # judgment that anything is wrong. Collapsing it into RECHECKED merges a PR
  # nothing has checked; collapsing it into the halting verdict stops a run over
  # checks that were merely slow, discarding a whole paid pipeline. So it gets
  # its own token, UNSETTLED, which PASSES — it is the one verdict that reaches
  # merge's WITHHELD fallback, and it is the only thing that may.
  #
  # The honest cost of a passing UNSETTLED: a node that replies it without
  # waiting is not caught by the pattern. What that buys is bounded, though —
  # the gate still stands between UNSETTLED and any merge, and merge's answer
  # to it is WITHHELD, so a premature UNSETTLED costs an operator's glance and
  # a refused merge, never a merge of unchecked code. RECHECKED is where a
  # premature answer would be expensive, and that is the token the wait is
  # actually protecting.
  #
  # What the halting verdict is called, and why it changed. It used to be
  # BLOCKED and to mean RED — "a judgment that something is WRONG with the code
  # being merged". That framing filed the wrong things in both directions. A
  # workflow run stuck on ACTION_REQUIRED halted as if the code were bad, when
  # what it needed was a click; and four conditions that need an operator and
  # nothing else — a required context with no reporter, a run awaiting a
  # maintainer's approval, a bot that will not review again until asked, a
  # branch that conflicts with its base — were polled for twenty minutes and
  # then passed to the gate as UNSETTLED, which says "wait longer" about things
  # no waiting reaches. The axis that actually matters is not red-vs-slow, it is
  # LATCHED-vs-SELF-RESOLVING: will the clock clear this, or will only a person?
  # So the token is LATCHED, it carries the ACT that clears it, and it is
  # absent from the pattern exactly as BLOCKED was, so the run still halts.
  # `triage` keeps its own BLOCKED for a different thing — "I could not finish
  # my own work" — and the two no longer share a word.
  #
  # The asymmetry between LATCHED and UNSETTLED is deliberate, and it is worth
  # stating rather than leaving to be inferred, because LATCHED is the LIKELIER
  # of the two: CodeRabbit re-requesting changes on the fix triage just pushed
  # is an ordinary post-triage outcome, not an exotic one — it happened four
  # times on 2026-08-10 and 2026-08-11 alone. A latch has nothing for the
  # operator to DECIDE at a gate: there is an act, and until someone performs
  # it nothing lands, so a gate over it is a question with one answer. A timeout
  # over something still moving is the operator's call and reaches the gate.
  # That is why one halts and the other passes, even though halting discards the
  # same paid pipeline in both cases. ADR 0021 is the rule this instantiates.
  #
  # A word on what this node does NOT do: it judges the SHA, not the content of
  # the review on it. An incremental review that COMMENTS on triage's fix passes
  # — see the header. Routing those back through triage would need an arc the
  # graph cannot express (same two reasons as above), so they are the operator's
  # to read at the gate.
  - id: recheck
    type: claude-run
    depends_on: [triage]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Triage reported:
      {{ artifacts.triage | inline }}

      If triage PUSHED a fix, the GitHub `test` check and CodeRabbit's review
      that ready-and-wait waited out concluded on a SHA that no longer exists
      on this PR. Wait them out again on the FINAL SHA, and say which SHA you
      judged.

      One read gives you everything, and it is the same read ready-and-wait
      made earlier. Project it down to the fields the rules below actually use
      — the raw `reviews` and `comments` arrays carry every body, which is
      kilobytes per poll of text no rule reads:
        gh pr view {{ inputs.pr }} \
          --json headRefOid,statusCheckRollup,reviewDecision,mergeStateStatus,reviews,comments \
          --jq '{head: .headRefOid,
                 review_decision: .reviewDecision,
                 merge_state: .mergeStateStatus,
                 checks: [.statusCheckRollup[] | {name: (.name // .context), status, conclusion, state}],
                 reviews: [.reviews[] | {who: .author.login, oid: .commit.oid,
                                         state, at: .submittedAt}],
                 last_bot_note: ([.comments[] | select(.author.login == "coderabbitai")] | last
                                 | {at: .createdAt,
                                    limited: ((.body // "") | test("review limit|rate limit"; "i")),
                                    excerpt: ((.body // "") | gsub("<!--[^>]*-->"; "")
                                              | (([scan("(?i).{0,40}(?:review limit|rate limit).{0,240}"; "m")] | first)
                                                 // (sub("^\\s+"; "") | .[0:240])))})}'
      `head` IS the final SHA; `checks` is the rollup of that same head commit;
      and every review carries the `who` who left it and the `oid` it was
      submitted against — so "CodeRabbit reviewed the FINAL SHA" and "somebody
      else is asking for changes" are both comparisons you can make, not
      guesses you have to take. The `excerpt` is the region AROUND the
      rate-limit phrase rather than the head of the comment, because the bot's
      notice sits ten lines under a walkthrough image.

      `reviews` covers EVERY reviewer, not just the bot. Filtering it down to
      `coderabbitai` is what let a human's CHANGES_REQUESTED reach `merge`
      labelled RECHECKED — not a hang but a merge, and the reason `who` is in
      the projection.
      `review_decision` is GitHub's rollup of that same list, and you REPORT it
      rather than judge by it, because it answers a coarser question than this
      node asks. It is PR-LEVEL and never scoped to a SHA, and a COMMENTED
      review does not clear a CHANGES_REQUESTED — so it stays set over a review
      a later push superseded. PR #145 merged correctly with `review_decision`
      CHANGES_REQUESTED: the only request for changes sat on a commit that no
      longer existed, and the act that field would have named — resolve the
      threads and re-request — had already been performed, answered COMMENTED,
      and left the field exactly where it was. A verdict whose named act cannot
      clear it is the failure ADR 0021 exists to stop, so the judgment below is
      made PER REVIEWER: who is asking, and about which commit.
      `merge_state` is GitHub's mergeability: CLEAN, BEHIND (base moved),
      BLOCKED (branch protection wants something), UNSTABLE (a non-required
      check is unhappy), HAS_HOOKS, DIRTY (conflicts with base), DRAFT, or
      UNKNOWN while GitHub is still computing it.

      A rollup entry is either a check run (it has `status` and `conclusion`)
      or a status context (it has `state`). Classify EVERY entry:
        - finished and good — `status` is COMPLETED and `conclusion` is
          SUCCESS, SKIPPED or NEUTRAL; or `state` is SUCCESS.
        - finished and bad — `status` is COMPLETED with any OTHER conclusion
          (FAILURE, CANCELLED, TIMED_OUT, ACTION_REQUIRED, STARTUP_FAILURE,
          STALE); or `state` is FAILURE or ERROR.
        - not finished — anything else (QUEUED, IN_PROGRESS, PENDING,
          EXPECTED).
      Judge the WHOLE rollup by that rule and NEVER one check by name. This
      graph runs against whatever repo you point it at, whose checks are named
      whatever they are named; the repo it was written in carries three entries
      where an earlier draft of this node looked only at `test`, and a red one
      of the other two would have been reported green.

      GREEN means ALL THREE of these hold on `head`:
        - every entry of `checks` is finished and good,
        - no reviewer OTHER than coderabbitai holds an OPEN request for changes
          — for each such person, their latest CHANGES_REQUESTED is followed by
          an APPROVED from that SAME person, and
        - coderabbitai's LATEST review on `head` — among the reviews whose
          `oid` equals `head`, the one with the greatest `at` — is not
          CHANGES_REQUESTED. Recency is the whole rule, not an "is there an
          approval somewhere" search: a PR routinely collects several reviews
          against one commit, and a CHANGES_REQUESTED landing after an
          APPROVED is CodeRabbit changing its mind, which is the answer that
          counts. A "review in progress" placeholder comment is not a
          submitted review and is not in this list.
      Those last two rules differ on purpose, and the difference is who
      re-reviews WITHOUT being asked. CodeRabbit reviews every push, so its word
      on `head` is its current word and an older CHANGES_REQUESTED on a replaced
      commit is spent — which is why the bot's rule is SHA-scoped. A person does
      not: theirs stands on whatever commit it was left against until that
      person approves or a maintainer dismisses it, so the SHA is not what
      settles it, and the act that clears it is a different act.
      `merge_state` does not decide GREEN — it is mechanics, and you REPORT it
      rather than judge it, with the one exception below (DIRTY and DRAFT are
      latches). BEHIND, BLOCKED, UNSTABLE and HAS_HOOKS on an otherwise green
      PR are what `merge` may answer with `--admin`, and it may do that only
      because you named the state and found no OPEN request for changes. One
      exception rides on the field you report rather than on the state: a
      BLOCKED whose `review_decision` is REVIEW_REQUIRED is protection waiting
      for an approval nobody has given, and `merge` refuses `--admin` over it.
      Report the field and it decides correctly; omit it and it cannot.

      Now the part that decides whether you POLL AT ALL. Not everything
      unfinished is slow. A condition is SELF-RESOLVING when a machine already
      at work will clear it with nobody doing anything: a check run
      IN_PROGRESS, a status context PENDING, `merge_state` UNKNOWN, a "review
      in progress" placeholder. Those are what a poll is FOR.
      A condition is LATCHED when the clock will never clear it, because what
      clears it is an ACT by a person. Polling one spends the whole timeout to
      learn nothing. Answer LATCHED at once — zero polls — for any of:
        - a `checks` entry finished and BAD → read that job's log; fix and
          push. That is a fresh run of this graph, not a wait.
        - a `checks` entry whose `conclusion` is ACTION_REQUIRED → approve the
          workflow run or deployment in the repo's Actions tab. (This is a
          latch, not a verdict on the code — it is finished-and-bad by the
          rollup rule, and the act, not the code, is what it needs.)
        - coderabbitai's LATEST review on `head` is CHANGES_REQUESTED → read
          the review. Resolve the threads or push a fix, then re-request the
          review (`@coderabbitai review`). The bot reviews what it is asked to,
          so this one does clear from that act.
        - a reviewer OTHER than coderabbitai holds an open request for changes
          (the GREEN rule above) → read that review. This one does NOT clear
          from a re-request or a push: `unblock:` is that reviewer re-reviewing
          with APPROVED, or a maintainer dismissing the review. Name the person
          and the commit their review sits on, so the act names somebody who
          can actually perform it.
          Neither of these two is `review_decision`: that field is set by
          either of them and cleared by neither on its own, so a verdict
          written off it would name an act that cannot clear it.
          This graph does not resolve a thread or re-trigger a reviewer
          on its own judgement: closing a reviewer's verdict is the reviewer's
          business and the operator's, and one of the four times an operator
          did it by hand, closing blind would have been wrong.
        - `merge_state` is DIRTY → the PR conflicts with its base: rebase or
          merge the base in, and push.
        - `merge_state` is DRAFT → `gh pr ready {{ inputs.pr }}` (ready-and-wait
          did this once already, so someone converted it back).
        - `last_bot_note.limited` is true AND `last_bot_note.at` is NEWER than
          the newest `at` in `reviews` — the bot's most recent word is that its
          review limit is reached, and `excerpt` carries that notice, which
          says "next review available in N minutes" → the clock opens the
          WINDOW, not the review: wait the stated N minutes, then post
          `@coderabbitai review` on the PR. Nothing arrives if nobody asks,
          which is why waiting out the N minutes on its own is not the answer.
          A note OLDER than the newest review is spent — the bot already
          reviewed past that limit — and is not a latch. (`limited` is a regex
          over the whole comment and can fire on one that merely discusses a
          rate limit; that costs a glance, and missing a real one costs the
          whole timeout.)
      Two conditions are only distinguishable from a self-resolving one by NOT
      MOVING: a `checks` entry stuck at QUEUED or EXPECTED (a run awaiting a
      maintainer's approval, or a required context with no reporter behind it
      at all), and no coderabbitai review on `head` (the bot was never
      re-invoked — a force-push does that). Poll those. If your budget runs out
      with them byte-for-byte as they started, they are LATCHED, not slow: say
      LATCHED and name the act — approve the run in the Actions tab, drop the
      dead required context, or post `@coderabbitai review`.
      A latch DOMINATES: if anything is latched, the answer is LATCHED even
      when other entries are still legitimately in flight.

      Do that read FIRST. If triage reported a count of zero (its first line
      is `TRIAGED 0`, however it is decorated) and that read is already green,
      answer immediately: nothing was pushed, so no check will restart and no
      review will be re-requested — there is nothing to re-wait for, and
      polling would spend the whole timeout on a state that cannot change.

      Otherwise poll SYNCHRONOUSLY, in the foreground: run the command, read
      it, then `sleep 30`, then run it again — one loop iteration per tool
      call, blocking each time. NEVER background anything: no `&`, no
      `nohup`, no run_in_background, no "I'll keep polling and report back".
      Your FINAL reply IS the verdict, so you cannot reply until the poll has
      actually reached one — an interim report ends the node and fails it.
      Judge the head SHA of your LAST read, not your first: if someone pushes
      while you poll, the final SHA moved and the checks you were watching
      belong to a commit nobody is merging. Start the judgment over on the
      new head.

      You have 20 minutes, and a loop is a `gh` read plus `sleep 30` plus your
      own turn — call it ~40 seconds, so ~25 loops is about seventeen. When you
      reach either bound, stop polling and answer from the state you actually
      have. Running out the node's timeout instead is the one thing worse than
      an honest UNSETTLED: it kills the node mid-turn, so there is no verdict
      at all and the whole run is discarded — the exact outcome UNSETTLED
      exists to prevent.

      Your reply must START with exactly one of these three verdicts — the
      token as the very FIRST characters, with no markdown emphasis
      (`**RECHECKED**` is WRONG), no heading, no backticks, no preamble —
      followed immediately by the 40-character head SHA you judged:
        - RECHECKED <sha> — GREEN on <sha>: every rollup entry finished good,
          nobody has an open request for changes, and CodeRabbit's latest word
          on that commit is not one either. Put BOTH `mergeable: <merge_state>`
          and `review_decision: <review_decision>` on that same first line
          after the SHA — merge reads them, and together they are the only
          thing that licenses `--admin` there. Report `review_decision` as GitHub
          gave it, including a CHANGES_REQUESTED you judged spent: merge is
          entitled to see the field you overrode and why the first line says
          green anyway.
        - LATCHED <sha> — a condition on <sha> that the clock will not clear.
          Name what is stuck, then `unblock:` and the act, on that first line:
          `LATCHED c80872c — coderabbitai CHANGES_REQUESTED; unblock: resolve
          the review threads, then post @coderabbitai review`. This FAILS this
          node deliberately, so the run halts here rather than offering the
          operator a gate over a PR that cannot land.
        - UNSETTLED <sha> — the time ran out while a SELF-RESOLVING condition
          was still moving on <sha>; name which entry and its current status.
      LATCHED and UNSETTLED are the same fact — "this did not conclude" — split
      by the only question the operator actually has to answer: do I do
      something, or do I wait? That answer must be the FIRST WORD of your
      reply, not a sentence inside it. An UNSETTLED written over a latch is
      worse than useless: it costs twenty minutes, passes, and hands the
      operator a gate over a PR nothing will ever unstick.
      "Still polling" is not a fourth verdict, and neither is a plan to keep
      going: this node's turn ends the moment you reply, so a poll you promise
      to continue is a poll nobody runs. UNSETTLED asserts that the waiting is
      OVER and the checks did not conclude, which is an outcome. It is not a
      way to say "not yet" and keep the node open, and it is not a cheaper
      RECHECKED: the operator reads it, and the merge that follows a gate
      approved over it will refuse to merge.
      Anything you need to qualify — the short-circuit having found nothing
      to wait for, a caveat, a note — goes AFTER the verdict, never before
      it: a line of context ahead of the token fails this node even when the
      wait is done.
    # Narrower than ready-and-wait's `Bash(gh *)`, which could push, merge or
    # close: this node only reads check state, and `gh pr view` is the whole
    # of what reading check state takes — the rollup, the head SHA and every
    # review's commit come out of one invocation of it. There is no mutating
    # form of `gh pr view` to be narrowed away from (`--jq` runs inside it, so
    # the projection needs no second grant). `sleep` is the poll.
    allowed_tools: ["Bash(gh pr view *)", "Bash(sleep *)"]
    permission_mode: dontAsk
    # 20m, not ready-and-wait's 15m, and the extra five are not padding: the
    # prompt's own budget is ~25 loops at roughly 40s each, which is ~17
    # minutes, so a 15m timeout would kill the node BEFORE it reached the
    # honest answer its instructions ask for. At ready-and-wait that mismatch
    # is harmless — overshoot and the honest answer both fail there. Here the
    # honest answer PASSES and the overshoot discards the run, which is
    # backwards, so the timeout has to outlast the loop budget.
    timeout: 20m
    handoff: artifact
    # Two of the three verdicts pass, so this is an anchored alternation like
    # merge's — but with ONE payload rule factored out of both branches rather
    # than a strong branch and a weak one: whichever way the wait ended, the
    # node has to name the SHA it ended on. A verdict about "the checks" that
    # cannot say which commit they ran against is the exact ambiguity this node
    # was added to remove, so it is not admitted from either side.
    # LATCHED is deliberately absent from the alternation: a condition only a
    # person can clear is not a passing outcome here, and leaving the token out
    # of the pattern is how the run halts before the gate — the same shape as
    # triage's BLOCKED, and the same shape as ready-and-wait's two failing
    # tokens. What the pattern CANNOT enforce is LATCHED's second half, the
    # `unblock:` act: a token the regex rejects is a token the regex cannot
    # shape. That half is prompt-side only, pinned in
    # `internal/graph/shipped_graphs_test.go` instead, and it is the honest
    # limit of "the convention is two halves" for any halting verdict.
    # Anchored and markdown-tolerant, narrow separator class (a false FAIL here
    # costs one re-run of a read-only poll, so it buys no dashes — see
    # DESIGN.md "Verdict patterns"). The separator is `+`, not `*`: a SHA fused
    # to its token (`RECHECKEDc80872c`) is not a verdict anyone writes, and a
    # `*` there admits it. The hex class takes both cases because `gh` prints
    # lowercase but a model retyping a SHA may not, and refusing a correct
    # verdict over its case buys nothing.
    #
    # What the payload does NOT prove, stated so nobody mistakes it for proof:
    # seven characters of the hex alphabet are typeable, and some of them spell
    # words (`RECHECKED defaced the head` matches). The SHA is here to make the
    # verdict SPECIFIC — to force the node to say which commit it judged — not
    # to be evidence the judging happened. Position is what rejects a promise,
    # here as at merge (ADR 0019 §3).
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s]*(RECHECKED|UNSETTLED)[*_`\s:]+[0-9a-fA-F]{7,40}\b'

  # Who is standing on this PR, read at the last moment it can still be acted
  # on. This is a READ, not a wait: a stack is a fact about other PRs, not a
  # condition a machine already at work will clear on its own, so there is
  # nothing here for a poll to be honest about and this node holds no `sleep`
  # (ADR 0021). It sits after recheck rather than beside verify because triage
  # may run for forty-five minutes and a PR can be opened against this branch
  # inside that window: the operator decides over the stack that exists at the
  # GATE, not the one that existed an hour earlier. That is the same argument
  # that made recheck a node instead of a longer wait at ready-and-wait.
  #
  # Direct children only, and the third read is what makes that honest: for
  # each child, one more `gh pr list --base <that child's head>` says whether
  # the child has children of its own. Those grandchildren are not moved — see
  # the header — but their existence is reported, because the depth is the one
  # fact that tells the operator the next run of this graph faces the same job
  # one link down.
  - id: stack-scan
    type: claude-run
    depends_on: [recheck]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Find out who is standing on PR #{{ inputs.pr }}. Nothing in this node
      changes anything; it only reads.
        1. `gh pr view {{ inputs.pr }} --json number,headRefName,baseRefName,title`
           — this PR's OWN head branch and the branch it targets. No node of
           this graph has ever read either one, which is how it stayed blind
           to its own stack.
        2. `gh pr list --base <the headRefName from step 1> --state open \
           --json number,title,headRefName,baseRefName` — every OPEN PR whose
           base is this PR's head branch. Those are the DIRECT children, and
           they are the PRs GitHub auto-closes when this PR merges and that
           branch goes away.
        3. For EACH child from step 2, exactly one more read:
           `gh pr list --base <that child's headRefName> --state open --json number`
           — the child's own children. Neither you nor the node below touches
           them; you report that they exist, because they are the next link of
           the same chain.
      One program per Bash call. No `|`, no `;`, no `&&`, no `$(...)`: a
      prefix grant authorises the program it names and NOT whatever follows a
      pipe, so a piped read is denied — and a denied read reported as an
      answer is how this node would invent a zero. Where you would have piped
      into `jq`, pass `--json` the fields you want and read the result
      yourself; the three reads above are small and every field named is one
      the verdict quotes.

      Your reply must START with exactly one of these two verdicts — the token
      as the very FIRST characters, with no markdown emphasis (`**STACKED**`
      is WRONG), no heading, no backticks, no preamble — and that first line
      holds the token and its number and nothing else:
        - STACKED <n> — n is at least 1: that many OPEN PRs have this PR's
          head branch as their base.
        - UNSTACKED 0 — no open PR is based on this PR's head branch.
      Then a NEWLINE, and from the SECOND line on, the facts the retarget and
      the gate both read:
        - this PR, on one line: `head: <headRefName>  base: <baseRefName>`.
          The retarget moves every child onto that BASE, so a report missing
          it stops the next node.
        - one row per child: its number, its title, its own head branch, and
          how many children of its OWN step 3 found.
      A child count you have to qualify is not a verdict, it is a progress
      report, and this node has none to give. If a read FAILED — `gh` is not
      authenticated, the repo refuses the list, an error you cannot attribute
      — do NOT write a zero you inferred: start with a bare BLOCKED and what
      stopped you, so the run halts here. A guessed zero is read downstream as
      a licence to delete this PR's head branch, which is the whole incident.
      Anything you need to qualify — a child that turned out to target main
      after all, a caveat, a note — goes AFTER the verdict, never before it: a
      line of context ahead of the token fails this node even when the read is
      done.
    # Read-only, and narrower than `Bash(gh *)` for the same reason recheck's
    # is: this node may not push, merge, close, comment or edit. Neither
    # `gh pr view` nor `gh pr list` has a mutating form, and the two together
    # are the whole of what reading a stack takes — this PR's own branches out
    # of one, everything based on them out of the other. `--json` runs inside
    # them, so the projection needs no second grant and no pipe.
    allowed_tools: ["Bash(gh pr view *)", "Bash(gh pr list *)"]
    permission_mode: dontAsk
    timeout: 10m
    handoff: artifact
    # Triage's shape: the count is the payload and the FIRST LINE is pinned to
    # token-and-number, so `STACKED 2 of maybe 3` has nowhere to live. Two
    # tokens rather than one because they are two different next actions —
    # children to move, or a stated absence the gate prints as a sentence —
    # and the operator must tell them apart from the first word of the
    # artifact. The pattern does NOT enforce that STACKED's number is at least
    # 1; both verdicts pass, and which one is written is a prompt-side claim.
    # BLOCKED is absent from the alternation, which is how a failed read halts
    # the run instead of licensing a branch deletion — the same shape as
    # triage's BLOCKED.
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s]*(STACKED[*_`\s:]*[0-9]+|UNSTACKED[*_`\s:]*0)[*_` \t]*(\n|$)'

  # Move the children while there is still something to move them off.
  #
  # It runs BEFORE the gate, and the argument is the asymmetry in the header
  # rather than a preference. Not moving a child produces a state no API call
  # undoes — closed, base gone, neither reopenable nor retargetable. Moving
  # one that did not need it produces a conflict a person resolves inside the
  # child. The window is not "until the operator approves", it is "until the
  # PR merges", and at an asynchronous gate those are hours apart.
  #
  # It is deliberately NOT folded into merge's step 1. Merge's grant is the
  # narrowest in this file because a false FAIL there sends a re-run back into
  # `gh pr merge` on a PR that may already be merged; a child loop living
  # inside it would make that same re-run replay the retargets too. Here a
  # re-run replays `gh pr edit --base` against a child that already carries
  # that base, which is a no-op, and it replays nothing irreversible: this
  # node halting leaves every PR in the stack open and unmerged.
  #
  # A retarget that does NOT land is reported and PASSES rather than halting,
  # which looks like the weaker choice and is not. `merge` is downstream, and
  # the entire point of telling it is that it then withholds `--delete-branch`
  # — so the child keeps standing on a branch that still exists, which is the
  # RECOVERABLE side of the asymmetry. Halting here would hand the operator
  # the merge to do by hand as well as the child.
  - id: stack-retarget
    type: claude-run
    depends_on: [stack-scan]
    cwd: "{{ inputs.repo }}"
    prompt: |
      The stack scan reported:
      {{ artifacts.stack-scan | inline }}

      If its first line is `UNSTACKED 0`, no open PR is based on PR
      #{{ inputs.pr }}'s head branch: change NOTHING, and answer with the
      `RETARGETED 0` verdict and the one-line STACK block below. Do not go
      looking for a child the scan did not find.

      Otherwise move every child the scan named off this PR's head branch and
      onto this PR's OWN base — the `base:` on the scan's second line. For
      EACH child, in the scan's order, two Bash calls and no more:
        1. `gh pr edit <child number> --base <this PR's base branch>`
        2. `gh pr view <child number> --json number,baseRefName,mergeable,mergeStateStatus`
           — the re-read IS the evidence. The retarget LANDED only if
           `baseRefName` now equals this PR's base; that it landed is not
           something you may conclude from step 1 exiting quietly. Record
           `mergeable` too: a retarget can introduce a conflict that did not
           exist before, and CONFLICTING is a fact a person needs afterwards,
           not a reason to move the child back.
      HARD limits, and they are what actually narrows this node — the grant is
      a ceiling, not a description:
        - Edit ONLY the PRs the scan named, and ONLY their `--base`. Not the
          title, not the body, not a label, not a reviewer.
        - Do NOT merge, close, reopen or comment on anything.
        - Do NOT touch a GRANDCHILD. A child's own children stay based on
          their parent, whose head branch still exists and whose PR is still
          open, so the chain shifts up one link and stays intact. Flattening a
          grandchild onto this PR's base would drag in commits it does not
          have and manufacture a conflict nobody asked for.
      One program per Bash call. No `|`, no `;`, no `&&`, no `$(...)`: a
      prefix grant does not authorise what comes after a pipe, and a denied
      call reported as an outcome is how this node would claim a retarget it
      never made.

      Your reply must START with exactly one of these two verdicts — the token
      as the very FIRST characters, with no markdown emphasis
      (`**RETARGETED**` is WRONG), no heading, no backticks, no preamble — and
      that first line holds the token and its number and nothing else:
        - RETARGETED <n> — every child the scan named is now based on this
          PR's base, each one confirmed by step 2's re-read. `RETARGETED 0` is
          the UNSTACKED case: there was nothing to move, which is NOT the same
          claim as having failed to move something.
        - PARTIAL <landed>/<total> — at least one child is STILL based on this
          PR's head branch. This PASSES on purpose: `merge` reads it and drops
          `--delete-branch`, so the branch that child stands on outlives the
          merge and the child stays open and recoverable.
      If you cannot honestly say either — the scan's report is unreadable,
      `gh` refuses every call, you cannot tell what landed — do NOT write a
      count you inferred: start with a bare BLOCKED and what stopped you. The
      run halts there with nothing merged, which is the safe direction.

      Then a NEWLINE, and then this block. It is what the operator reads at
      the gate, so fill the angle brackets and leave the sentences as they
      are, one per line:

      STACK: <n> open child PR(s) had this PR's head branch as their base.
        #<num> "<title>" — retargeted to <base>, now <MERGEABLE|CONFLICTING|UNKNOWN>
        #<num> "<title>" — NOT retargeted, still based on <head>; the re-read still shows this PR's head branch
      Retargeting happened before this gate, not after your approval, because the window closes the moment this PR merges: GitHub deletes the head branch, auto-closes every child, and a closed PR whose base is gone can be neither reopened nor retargeted (see #211, 2026-08-21).
      A retarget can introduce a conflict that did not exist before; any child marked CONFLICTING above needs a human afterwards.
      --delete-branch will be <applied|withheld> on merge, because <no child remains based on this head|child #<num> is still based on it>.
      Another link below: child #<num> has children of its own; they were left based on #<num> and will be handled when #<num> is shepherded.

      One `#<num> …` row per child, in the scan's order, and step 2's re-read
      decides WHICH of the two forms that row takes — not what you intended,
      and not that step 1 exited quietly. The FIRST form only when the
      `baseRefName` you read back equals this PR's base; the SECOND whenever
      it still shows this PR's head, which is the same reading that makes the
      verdict PARTIAL. A second-form row carries NO mergeability: the child
      was never moved, so nothing re-evaluated it, and an `UNKNOWN` there
      would read as a retarget whose result is merely unclear rather than one
      that did not happen — the gate would then approve a merge believing a
      rescue that never landed. The `Another link below:` line once per child
      that has children of its own, so several lines when several do, and not
      at all when none does; the scan looked ONE link down, so that line says
      a next link exists and never how far the chain runs past it. When the
      scan found nothing at all, the whole block is this one line, because a
      stated absence is what the gate needs and silence is not:

      STACK: no open PR is based on this PR's head branch; --delete-branch will be applied.

      Anything you need to qualify — a child that already carried the right
      base, a caveat, a note — goes AFTER the verdict, never before it: a line
      of context ahead of the token fails this node even when every child
      moved.
    # Two commands, and `gh pr edit` is the only mutating grant in this graph
    # outside `merge`'s own. It is wider than the job — the same command sets
    # titles, bodies, labels and reviewers — and the narrowing that actually
    # holds is not in the grant string but in the prompt's HARD limits plus
    # the evidence they leave behind: every claim this node makes about a
    # child is a `baseRefName` it read back with `gh pr view`. `gh pr merge`
    # and `gh pr close` are deliberately absent, so the worst this node can do
    # to a PR it should not have touched is retarget it, which is the one
    # thing a person can undo.
    allowed_tools: ["Bash(gh pr edit *)", "Bash(gh pr view *)"]
    permission_mode: dontAsk
    timeout: 15m
    handoff: artifact
    # Triage's shape again — first line pinned to token-and-number, so
    # `RETARGETED 2 of 3, the rest to follow` cannot pass as an outcome — and
    # like recheck, the node has three tokens of which two pass. PARTIAL's
    # payload is a FRACTION rather than a count because the number that
    # matters downstream is the one that did not land: `PARTIAL 1/2` says a
    # child is still based on this head, which is exactly what makes `merge`
    # withhold `--delete-branch`. BLOCKED is absent from the alternation and
    # halts the run, the same way triage's does, and it halts before anything
    # merges.
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s]*(RETARGETED[*_`\s:]*[0-9]+|PARTIAL[*_`\s:]*[0-9]+/[0-9]+)[*_` \t]*(\n|$)'

  # The human gate: the run stops here with exit 2 after triage's table and
  # recheck's verdict are in. Read them, then
  # `oh-my-graph resume <run-id> --approve approve-merge` (or
  # --reject approve-merge to end the run without merging).
  #
  # CI and review status on the FINAL SHA is no longer yours to confirm — that
  # is what recheck is, and its verdict names the SHA it judged, GitHub's
  # `reviewDecision` as it found it, and the mergeability state, having judged
  # every reviewer's own review rather than one bot's. One thing that sentence
  # does NOT cover, because no node can: a reviewer who has not looked yet.
  # `review_decision: REVIEW_REQUIRED` on recheck's line means nobody has
  # approved — the merge below will refuse `--admin` over it, and whether to
  # wait for that approval is yours.
  # Until 2026-08-11 that sentence promised more than the
  # node delivered: recheck filtered reviews down to one bot, so a human's
  # CHANGES_REQUESTED reached this gate labelled RECHECKED, with the comment
  # above telling the operator not to look. It is true now.
  # What is left here is the decision the gate is for: whether this change
  # should land. One thing worth knowing before you type --approve: if recheck
  # came back UNSETTLED, the checks never concluded on that SHA, and merge will
  # answer WITHHELD rather than merge past them. Rejecting is the cheaper answer
  # to UNSETTLED — it ends the run without spending merge's session — and a
  # fresh run once CI has settled is the way back. A LATCHED recheck never
  # reaches this gate at all: it fails the node and halts the run, and the act
  # that unsticks the PR is on the first line of `<run-id>/failed/recheck.out`.
  #
  # One more thing is on the table now, and it has already HAPPENED:
  # stack-retarget's artifact opens with a `STACK:` block naming every open PR
  # that had this PR's head branch as its base, where each was moved to and
  # whether the move left it CONFLICTING — or, for a child whose row says NOT
  # retargeted, that it was not moved at all. Read it. The moves are done — they
  # ran before this gate, because the window closes when this PR MERGES rather
  # than when you approve, and a closed PR whose base branch is gone can be
  # neither reopened nor retargeted (#207 merged at 2026-08-20T23:48:35Z, #211
  # closed at 23:48:37Z, recovered by hand as #223). So what is yours here is
  # not the rescue but its consequences: a child marked CONFLICTING needs a
  # person afterwards, and a `--delete-branch will be withheld` line means the
  # merge below leaves this PR's head branch on the remote because a child is
  # still standing on it. If the block reports another link below, that link is
  # a separate run of this graph. Rejecting is the cheaper answer when the
  # stack is deep or the children are somebody else's: shepherd the stack from
  # the BOTTOM, one PR at a time, and every run then faces one link.
  - id: approve-merge
    type: gate
    depends_on: [stack-retarget]

  - id: merge
    type: claude-run
    depends_on: [approve-merge]
    cwd: "{{ inputs.repo }}"
    prompt: |
      The operator has approved the merge of PR #{{ inputs.pr }}. Triage
      reported: {{ artifacts.triage | inline }}.
      Recheck reported: {{ artifacts.recheck | inline }}.
      The stack retarget reported:
      {{ artifacts.stack-retarget | inline }}
      Recheck is the node that waited out the whole check rollup and CodeRabbit
      on the FINAL SHA, so you do not wait for anything and you do not re-judge
      them. If recheck's verdict begins with UNSETTLED, its wait ran out with
      a check still pending on that SHA: do NOT merge, do NOT poll for it
      yourself, and answer WITHHELD naming the SHA and the check recheck left
      pending. If it begins with RECHECKED, the checks concluded green on the
      SHA named there and you may merge.
        0. Establish the state BEFORE you change it:
           `gh pr view {{ inputs.pr }} --json state,mergeCommit`. If it is
           already MERGED, a previous attempt at this node merged it and then
           failed its own verdict check — do NOT re-enter step 1. Take the
           merge commit SHA from that output, SKIP step 1, and do steps 2-4.
           Confirm the SHA only AFTER step 2 has updated the remote-tracking
           ref, with `git merge-base --is-ancestor <sha> origin/main` — a
           check against a stale or truncated `origin/main` can miss a merge
           that really landed and send this node into a second false FAIL.
           Then report MERGED <sha> for the merge that already landed.
        1. `gh pr merge {{ inputs.pr }} --squash`, and add `--delete-branch`
           ONLY when the retarget verdict above is RETARGETED — nothing open
           is based on this PR's head branch any more, either because the scan
           found no child or because every child was moved off it and read
           back. If that verdict is PARTIAL, a child is STILL based on this
           head: merge WITHOUT `--delete-branch` and name that child in your
           ledger line. Deleting a branch an open PR is based on is answered
           by GitHub CLOSING that PR, and a closed PR whose base branch is
           gone can be neither reopened nor retargeted — #207 did exactly that
           to #211 on 2026-08-20, and the work had to be re-opened by hand as
           #223. The flag is the only part of this step the stack decides;
           everything below it is unchanged by the stack.
           Try the plain merge FIRST, with no `--admin`. Add `--admin` only
           when ALL
           THREE hold: the plain merge failed on branch-protection or
           merge-queue mechanics; recheck's verdict is RECHECKED naming a
           mechanical state — its first line says `mergeable:` BEHIND, BLOCKED,
           UNSTABLE or HAS_HOOKS; and that same line does NOT say
           `review_decision: REVIEW_REQUIRED`. That third one is the case where
           protection is holding the PR because NOBODY has approved it yet, and
           BLOCKED is what it reports — `--admin` there is precisely "a way
           past a review", so the honest answer is WITHHELD naming the missing
           approval. What makes the rest legitimate is NOT "CodeRabbit
           concluded": it is that recheck read every reviewer's own review, not
           one bot's, and found no OPEN request for changes — a human's
           CHANGES_REQUESTED counts there and does not clear on a push.
           `--admin` must never be used to get past a review. An open request
           for changes cannot reach you — recheck answers LATCHED to it and the
           run halts — so if you are reaching for `--admin` without a
           `mergeable:` state to point at, the honest answer is WITHHELD naming
           what refused the merge.
        2. In {{ inputs.repo }}: `git pull --ff-only origin main`.
        3. `make build` — SYNCHRONOUSLY, waiting for the exit code, never
           in the background.
        4. Prune stale local state for this PR: `git remote prune origin`,
           and `git branch -d` the PR's local branch if one exists. When
           `--delete-branch` was withheld in step 1, the remote branch is
           still there ON PURPOSE and prune leaves it — that is the child
           standing on it, not a step that failed.
      Run every step in the foreground and finish all of them before you
      answer. Your FINAL reply IS the verdict: this node's turn ends the
      moment you reply, so anything you promise to do afterwards never
      happens. NEVER end on a plan to continue — "I'll proceed as soon as
      the review lands", "poller armed, 30s interval" — that is not a
      verdict, and a reply exactly like it once ended this run green with
      nothing merged. Report the state that is TRUE AS YOU REPLY, as
      exactly one of these two verdicts, whose token must be the very
      FIRST characters of the reply, with no markdown emphasis
      (`**MERGED**` is WRONG), no heading, no backticks, no preamble:
        - MERGED <sha> — the squash merge has landed. The merge commit SHA
          comes immediately after the token with nothing in between
          (`MERGED 4f2a1c9`), then a one-line ledger of what shipped, which
          says whether `--delete-branch` was applied or withheld and which
          child withheld it.
        - WITHHELD <reason> — you decided NOT to merge and the PR is still
          open. The blocking fact comes immediately after the token
          (`WITHHELD recheck left test pending on 4f2a1c9`). This is a
          legitimate outcome and it PASSES: refusing to merge past an
          unfinished review is this graph working as designed. It is now a
          FALLBACK, not the routine answer — recheck is what waits, so the
          case that reaches here is an UNSETTLED recheck the operator
          approved over anyway.
      "Not yet" is not a third verdict. If you are tempted to wait for
      something, the honest answer is WITHHELD naming what you are waiting
      for — the operator decides whether to re-run.
      Anything you need to qualify — step 4 finding no local branch to
      delete, a caveat, a note — goes AFTER the verdict, never before it.
      One line of housekeeping ahead of the token failed this node after a
      real merge (run 20260807-144514, PR #135); step 0 makes the re-run of
      that mistake safe, not free — it still costs a whole session.
    # Narrower than every other node's grant: this is the one irreversible
    # mutation in the pipeline, so the only thing it may CHANGE is the merge
    # itself and the local state that follows it. The two read-only commands
    # are what make a false FAIL here cost exactly one re-run, like everywhere
    # else: without them a re-run cannot tell a PR nobody merged from one this
    # node merged before failing its own verdict check, and blindly re-enters
    # `gh pr merge`. They add no mutation — see step 0 and ADR 0019.
    allowed_tools:
      - "Bash(gh pr view *)"
      - "Bash(git merge-base *)"
      - "Bash(gh pr merge *)"
      - "Bash(git pull *)"
      - "Bash(git remote prune *)"
      - "Bash(git branch -d *)"
      - "Bash(make build)"
    permission_mode: dontAsk
    timeout: 15m
    handoff: artifact
    # Two legitimate outcomes, one anchored alternation: it merged, or it
    # deliberately did not. What the shape exists to reject is the reply
    # that is NEITHER — the "re-review is mid-flight, I'll proceed as soon
    # as it lands" promise, which under a bare `exit_zero: true` passed,
    # recorded a successful merge step in the ledger, and merged nothing.
    # MERGED must carry a commit SHA: a merge that really happened leaves
    # one, a merge the node only intends does not. The SHA comes from step
    # 2's `git pull --ff-only` range, which is the whole reason that step is
    # inside this node's grant — narrowing it would leave the node unable to
    # produce the evidence its own verdict requires.
    #
    # The separator class admits `-` and `—` here and nowhere else in this
    # repo, because this node is the one place a false FAIL is not merely a
    # retry: `MERGED — 4f2a1c9` after a real merge would fail a node whose
    # re-run re-enters `gh pr merge` on an already-merged PR, under a grant
    # too narrow to even look at what happened. Dashes cost nothing to admit
    # — the SHA is still the gate, so `MERGED — the squash is queued` fails
    # exactly as before — and the tokens contain no dash of their own, so
    # DESIGN.md's token-choice rule is untouched.
    #
    # That widened class is also why WITHHELD closes on `[[:alnum:]]` rather
    # than `\S`: a greedy separator run can always hand its own last
    # character back to `\S`, so `WITHHELD:` and `WITHHELD —` would pass
    # carrying no reason — the token with the blocking fact stripped out of
    # it. An alnum cannot be a separator, and every decoration a real reason
    # is written behind is still absorbed on the way to it.
    #
    # The anchor is `^`, over the whole REPLY, like every other verdict in
    # this repo. Relaxing it to `(?m)` — matching per line, so PR #135's
    # verdict-on-line-3 would have passed — was measured and REFUSED, because
    # the SHA is not the promise-proof payload it looks like:
    #
    #   $ MERGED 4f2a1c9        # the example six lines up, quoted back
    #   $ MERGED <PR head SHA>  # exists before the squash does
    #
    # Seven hex characters are producible by a model that has merged nothing.
    # Under `^` a promise cannot reach them, because a promise is preamble
    # first by construction — "I'll merge when the review lands" comes before
    # the quote of what the reply will say. Under `(?m)` that preamble is
    # free, and five constructed promise replies (a plan listing both
    # verdicts as bullets, an indented code block quoting the instruction, a
    # "will be" sentence carrying the PR head SHA) all pass. Position IS the
    # lock here, same as for a bare-word verdict. ADR 0019 has the replay.
    #
    # The false FAIL that prompted the question is paid for in step 0 and in
    # this node's grant instead, which is the honest place: the pattern was
    # never wrong about PR #135's reply, the re-run was just expensive.
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s\-—]*(MERGED[*_`\s:\-—]*[0-9a-f]{7,40}\b|WITHHELD[*_`\s:\-—]*[[:alnum:]])'
