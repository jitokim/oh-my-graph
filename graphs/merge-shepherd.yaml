# merge-shepherd — the operator's PR-shipping loop as a graph.
#
#   verify ─▶ ready-and-wait ─▶ triage ─▶ recheck ─▶ approve-merge ─▶ merge
#                                                       (gate)
#
# What this replaces: the loop the human operator runs by hand on every PR —
# fetch the head, `make local` in a scratch checkout, mark the PR ready, wait
# for CI and CodeRabbit, work through the review comments, wait out the checks
# your own fix restarted, merge, pull, rebuild, prune. Same steps, same order,
# pinned in YAML — with the merge policy encoded in the graph shape itself:
# merge happens only AFTER CodeRabbit's review has completed on the SHA being
# merged and said something other than "changes requested" there, every comment
# it had made when triage ran is actioned, and `--admin` is never a way past an
# unfinished review (it may only grease merge-queue mechanics once the review is
# complete — see CONTRIBUTING). Note the seam that wording leaves, because the
# graph does not close it: an incremental review of triage's OWN fix that merely
# COMMENTS passes recheck untriaged, since there is no arc back to triage. Its
# notes reach the operator at the gate and nowhere else.
#
# Clean tree required: verify and merge run `git`/`make` inside the repo you
# point at. The PR itself is only ever touched through THROWAWAY worktrees
# (`git worktree add /tmp/shepherd-... FETCH_HEAD` — plain git run by the
# node via Bash, not the engine's `worktree:` seam, which branches from the
# invocation repo's HEAD rather than the PR head this graph needs).
#
# Honest note on the two waits: ready-and-wait and recheck are POLLS under a
# timeout, not event subscriptions — `sleep 30` loops between `gh pr view`
# reads, in the FOREGROUND, bounded by each node's own timeout. A node's final
# reply is its verdict, so nothing may be backgrounded: a node that kicks off a
# polling loop and reports "will follow up" has already ended its turn, and
# success_check sees the interim report instead of the verdict. The two waits
# differ only in what an unfinished wait means. ready-and-wait waits BEFORE any
# fix exists, so not-yet-concluded is a plain failure — it reports the actual
# state, fails its READY check, and the operator decides. recheck waits AFTER
# triage may have pushed, where the whole run is already paid for, so its
# timeout is a third verdict rather than a failure; see its own comment.
#
# The merge verdict is two-valued on purpose: MERGED <sha> or WITHHELD
# <reason>. A deliberate refusal to merge PASSES — refusing to go past an
# unfinished review is this graph working, not failing — so a green run is
# not by itself proof that anything landed. Read merge's artifact. WITHHELD is
# a FALLBACK, not the routine answer to pending checks: recheck is what waits
# for those now, and merge reaches WITHHELD only when recheck came back
# UNSETTLED and the operator approved the gate anyway. Say the trade plainly:
# the checks-outlast-the-wait case ends GREEN having merged nothing — UNSETTLED
# passes and merge answers WITHHELD — and it ended green before recheck too,
# because WITHHELD was then the ROUTINE answer to a review triage's own push had
# restarted, and WITHHELD passes. Three of the five observed hits ended exactly
# that way (see the recheck comment). So this node does not turn a red
# terminal state green; it makes that state RARER — the common case, a fix
# pushed and checks that restart and conclude in minutes, now merges where it
# used to withhold — and VISIBLE, since recheck names the SHA and the pending
# entry before the gate instead of merge discovering it after. What must never
# pass is
# the third thing a model writes: a promise to merge later. That reply once
# ended a real run of this graph green with nothing merged, and the only reason
# the operator noticed was that `git pull` did not move.
#
# The mirror failure has happened too, and it is fixed on the OTHER side. Run
# 20260807-144514 merged PR #135 for real, opened its reply with one line of
# housekeeping ("no local branch to delete"), put `MERGED 83edfad…` on the
# next line, and was recorded FAIL. The verdict still anchors at the start of
# the REPLY, not of a line: a line anchor lets the promise straight back in,
# because a model can put `MERGED <7 hex>` on a line of a plan — the example
# in this very prompt is seven hex characters — long before anything merges.
# What changed instead is what that false FAIL costs. Step 0 below, plus two
# read-only commands in this node's grant, let a re-run SEE that the PR is
# already merged and report it, so correcting a false FAIL here is the same
# free re-run it is at every other node. See the success_check comment below
# and ADR 0019.
#
# The run pauses at the approve-merge gate (exit 2). Read triage's table and
# recheck's verdict — which names the SHA it judged — then resume:
#   oh-my-graph resume <run-id> --approve approve-merge
#
# Run (against a clean tree):
#   oh-my-graph run graphs/merge-shepherd.yaml \
#     --input repo=/path/to/repo \
#     --input pr=123
name: merge-shepherd
version: "0.1"
inputs: [repo, pr]
concurrency: 1 # the flow is a strict chain — nothing ever runs in parallel
nodes:
  - id: verify
    type: claude-run
    cwd: "{{ inputs.repo }}"
    prompt: |
      You are in the repo at {{ inputs.repo }}; its working tree is clean and
      must stay untouched. Verify that PR #{{ inputs.pr }} passes the local
      suite, in a throwaway checkout:
        0. Clear any leftover from an earlier attempt so a retry cannot
           collide: `git worktree remove --force /tmp/shepherd-{{ inputs.pr }}`
           (ignore the error if there is nothing to remove).
        1. `gh pr view {{ inputs.pr }}` and `gh pr diff {{ inputs.pr }}` to
           see what the PR is.
        2. `git fetch origin pull/{{ inputs.pr }}/head`
        3. `git worktree add /tmp/shepherd-{{ inputs.pr }} FETCH_HEAD`
        4. `make -C /tmp/shepherd-{{ inputs.pr }} local` — run it
           SYNCHRONOUSLY and wait for the exit code, never in the
           background: your final reply IS the verdict, so you cannot reply
           before the suite has finished.
        5. ALWAYS remove the worktree before you answer, on the FAIL path
           as well as the PASS path:
           `git worktree remove --force /tmp/shepherd-{{ inputs.pr }}`
      Your reply must START with the bare word PASS — those four characters
      as the very FIRST characters of the reply, with no markdown emphasis
      (`**PASS**` is WRONG), no heading, no backticks, no preamble — or with
      a bare FAIL followed by the failing step.
      Anything you need to qualify — a step that had nothing to do, a
      caveat, a note — goes AFTER the verdict, never before it: a line of
      context ahead of the token fails this node even when the work is done.
    allowed_tools: [Read, "Bash(gh *)", "Bash(git *)", "Bash(make *)"]
    permission_mode: dontAsk
    timeout: 30m
    handoff: artifact
    # Anchored so a FAIL report that merely mentions the word cannot pass,
    # and tolerant of leading markdown emphasis, which a model adds unbidden
    # (`**PASS**` halted a real run of this very graph).
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*PASS' }

  - id: ready-and-wait
    type: claude-run
    depends_on: [verify]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Local verify said: {{ artifacts.verify | inline }}.
      Mark PR #{{ inputs.pr }} ready for review: `gh pr ready {{ inputs.pr }}`.
      Then poll SYNCHRONOUSLY, in the foreground, and wait out every check:
      run `gh pr view {{ inputs.pr }} --json reviews,statusCheckRollup`,
      read it, then `sleep 30`, then run it again — one loop iteration per
      tool call, blocking each time. NEVER background anything: no `&`, no
      `nohup`, no run_in_background, no "I'll keep polling and report
      back". Your FINAL reply IS the verdict, so you cannot reply until
      the poll has actually reached a verdict — an interim report ends the
      node and fails it.
      Keep looping until BOTH hold:
        - the `test` check has concluded with SUCCESS, and
        - coderabbitai has a COMPLETED review on the PR (a submitted review
          in the reviews list; a "review in progress" placeholder comment
          does not count).
      When both hold, your reply must START with the bare word READY — those
      five characters as the very FIRST characters, with no markdown emphasis
      (`**READY**` is WRONG), no heading, no preamble — plus a one-line
      status after it.
      Anything you need to qualify — a check that had nothing to report, a
      caveat, a note — goes AFTER the verdict, never before it: a line of
      context ahead of the token fails this node even when both conditions
      hold.
      You have 15 minutes: as that timeout comes near (after ~25 loops),
      stop polling and reply with the honest current state — which
      condition is still missing and what it says — as your final answer.
      The operator decides what to do next. NEVER reply READY early.
    allowed_tools: ["Bash(gh *)", "Bash(sleep *)"]
    permission_mode: dontAsk
    timeout: 15m
    handoff: artifact
    # Same shape as verify's: anchored, but tolerant of leading emphasis.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*READY' }

  - id: triage
    type: claude-run
    depends_on: [ready-and-wait]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Triage every CodeRabbit review comment on PR #{{ inputs.pr }}. List
      them all: `gh api repos/{owner}/{repo}/pulls/{{ inputs.pr }}/comments`
      plus the review bodies from `gh pr view {{ inputs.pr }} --json
      reviews`. If there are zero comments, reply `TRIAGED 0` and stop.
      For each comment, do exactly one of:
        - Mechanical and within the PR's scope → apply it. Build a fresh
          throwaway checkout of the PR head
          (`git fetch origin pull/{{ inputs.pr }}/head`, then
          `git worktree add /tmp/shepherd-triage-{{ inputs.pr }} FETCH_HEAD`),
          make the edit there, run the repo's checks
          (`make -C /tmp/shepherd-triage-{{ inputs.pr }} local` —
          SYNCHRONOUSLY, waiting for the exit code, never in the
          background), commit
          staging ONLY the files you changed by explicit path (`git add
          <path> ...` — never `git add -A`/`.`/`-u`), push to the PR's
          branch (`git push origin HEAD:<pr-branch>`), and remove the
          worktree when done.
        - You disagree, or it is out of the PR's scope → reply to that
          comment via `gh api` with a one-sentence reason.
      HARD limits: do NOT weaken or delete tests, and do NOT change
      behavior beyond what a comment literally asks — anything bigger is
      the operator's call, not this node's.
      Every comment must have been actioned BEFORE you reply. Your FINAL
      reply IS the verdict: this node's turn ends the moment you reply, so
      a comment you plan to get to afterwards is a comment nobody ever
      handles. Never end on "the rest to follow".
      The reply's FIRST LINE is the verdict and holds nothing else: the
      bare token TRIAGED, a space, and the number of comments you actioned
      — `TRIAGED 7`, or `TRIAGED 0` when the PR has none — then a NEWLINE.
      Those characters FIRST, with no markdown emphasis (`**TRIAGED**` is
      WRONG), no heading, no preamble, and nothing after the number on that
      line: not a unit, not a qualifier, not `of`. A count you have to
      qualify ("3 of 7 so far") is not a verdict, it is a progress report,
      and this node has no progress to report — only an outcome. The triage
      table starts on the SECOND line: one row per comment → the action
      taken (applied in <commit> / replied: <reason>).
      Anything you need to qualify goes in that table or below it, never
      above the first line: a line of context ahead of the token fails this
      node even when every comment was actioned. If you could not
      finish, do NOT write TRIAGED: start with a bare BLOCKED and what
      stopped you, so the run halts before the merge gate instead of
      passing it.
    allowed_tools: [Read, Edit, "Bash(gh *)", "Bash(git *)", "Bash(make *)"]
    permission_mode: dontAsk
    timeout: 45m
    handoff: artifact
    # The count is the payload — but a count alone is NOT the assertion the
    # node needs, because a partial count is still a count: `TRIAGED 3 of 7
    # so far — the rest to follow` is the very promise this exists to
    # reject, and it satisfies "TRIAGED then a digit". So the pattern pins
    # the whole FIRST LINE to token-and-number: the number must be followed
    # by a newline (or the end of the reply), which leaves nowhere to put
    # the "of 7 so far" that turns an outcome back into a progress report.
    # Hence the narrow trailing class — spaces and emphasis, deliberately
    # NOT `\s`, which would swallow the newline the pin depends on.
    # Anchored and markdown-tolerant (see DESIGN.md "Verdict patterns").
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*TRIAGED[*_`\s:]*[0-9]+[*_` \t]*(\n|$)' }

  # The re-wait, and why it is an ordinary node rather than a feedback arc.
  #
  # When triage pushes a fix, GitHub restarts the `test` check and sends
  # CodeRabbit back for an incremental review — both of which ready-and-wait
  # already waited out, on the SHA that push replaced. Without this node the
  # graph asks the human at the gate to perform the wait the graph exists to
  # perform, and the observed failure is not that the human refuses — it is
  # that `merge` meets the restarted check itself. Five runs between 2026-08-04
  # and 2026-08-08 hit it, and the loud shape was the rare one:
  #   - THREE times merge answered WITHHELD to the review this push restarted,
  #     which PASSES, so the run ended green having merged nothing —
  #     20260804-170325 (PR #111) and 20260807-154947 (PR #137), both on a
  #     re-review still PENDING on the triage commit; 20260807-144230 (PR #134),
  #     on a new CHANGES_REQUESTED against it.
  #   - ONCE it waited in the foreground instead, ran out of turn, and answered
  #     with a promise ("checks are still running ... waiting in the foreground
  #     until they conclude"), which the anchored verdict correctly rejected, so
  #     the run halted — 20260808-004132 (PR #137).
  #   - ONCE that same promise PASSED, because it predates the anchor: merge's
  #     success_check was `exit_zero` alone — 20260804-143531 (PR #107). That is
  #     the run the header's "git pull did not move" sentence is about.
  # Three of the five are therefore the quiet failure, not the halt: the graph
  # went green and shipped nothing.
  #
  # It cannot be a `feedback:` arc, for two independent reasons, both checked
  # against the code and not just the ADRs:
  #   - an arc fires only on a JUDGMENT FAILURE OF THE DECLARING NODE
  #     (`schedule.judgeFeedback` returns early unless `node.Feedback != nil`
  #     AND `isJudgmentFailure(cause)`; ADR 0010, "What fires the arc"). The
  #     thing that must re-open the wait is triage SUCCEEDING with a push —
  #     which is a PASS, and a PASS fires nothing.
  #   - load rule 4 forbids a gate anywhere in a loop body
  #     (`graph.validateFeedback`: `member.Type == TypeGate` is a
  #     GraphValidationError, because replaying a recorded decision on a later
  #     round would re-approve a round the human never saw). An arc declared on
  #     `merge` and aimed back before triage would pull approve-merge into the
  #     body, so the graph would not load at all.
  # A wait that must happen every time a fix lands is not failure recovery. It
  # is a step, so it is a node.
  #
  # Three verdicts, and the third is the reason this is not two. "Concluded
  # green" and "concluded red" are not the whole space: the checks may still be
  # pending when the timeout runs out, and that outcome is neither a pass nor a
  # judgment that anything is wrong. Collapsing it into either lies. Collapsing
  # it into RECHECKED merges a PR nothing has checked; collapsing it into
  # BLOCKED halts a run over checks that were merely slow, discarding a whole
  # paid pipeline. So it gets its own token, UNSETTLED, which PASSES — it is
  # the one verdict that reaches merge's WITHHELD fallback, and it is the only
  # thing that may.
  #
  # The honest cost of a passing UNSETTLED: a node that replies it without
  # waiting is not caught by the pattern. What that buys is bounded, though —
  # the gate still stands between UNSETTLED and any merge, and merge's answer
  # to it is WITHHELD, so a premature UNSETTLED costs an operator's glance and
  # a refused merge, never a merge of unchecked code. RECHECKED is where a
  # premature answer would be expensive, and that is the token the wait is
  # actually protecting.
  #
  # The asymmetry between BLOCKED and UNSETTLED is deliberate, and it is worth
  # stating rather than leaving to be inferred, because BLOCKED is the LIKELIER
  # of the two: CodeRabbit re-requesting changes on the fix triage just pushed
  # is an ordinary post-triage outcome, not an exotic one. A red conclusion is
  # a judgment that something is WRONG with the code being merged, and there is
  # nothing for the operator to decide at a gate over it — the fix is another
  # round, which is a fresh run. A timeout judges nothing about the code, so it
  # is the operator's call and reaches the gate. That is why one halts and the
  # other passes, even though halting discards the same paid pipeline in both
  # cases.
  #
  # A word on what this node does NOT do: it judges the SHA, not the content of
  # the review on it. An incremental review that COMMENTS on triage's fix passes
  # — see the header. Routing those back through triage would need an arc the
  # graph cannot express (same two reasons as above), so they are the operator's
  # to read at the gate.
  - id: recheck
    type: claude-run
    depends_on: [triage]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Triage reported:
      {{ artifacts.triage | inline }}

      If triage PUSHED a fix, the GitHub `test` check and CodeRabbit's review
      that ready-and-wait waited out concluded on a SHA that no longer exists
      on this PR. Wait them out again on the FINAL SHA, and say which SHA you
      judged.

      One read gives you everything. Project it down to the fields the rules
      below actually use — the raw `reviews` array carries every review BODY,
      which is kilobytes per poll of text no rule reads:
        gh pr view {{ inputs.pr }} --json headRefOid,statusCheckRollup,reviews \
          --jq '{head: .headRefOid,
                 checks: [.statusCheckRollup[] | {name: (.name // .context), status, conclusion, state}],
                 reviews: [.reviews[] | select(.author.login == "coderabbitai")
                           | {oid: .commit.oid, state, at: .submittedAt}]}'
      `head` IS the final SHA; `checks` is the rollup of that same head commit;
      and every review carries the `oid` it was submitted against — so
      "CodeRabbit reviewed the FINAL SHA" is a comparison you can make, not a
      guess you have to take.

      A rollup entry is either a check run (it has `status` and `conclusion`)
      or a status context (it has `state`). Classify EVERY entry:
        - finished and good — `status` is COMPLETED and `conclusion` is
          SUCCESS, SKIPPED or NEUTRAL; or `state` is SUCCESS.
        - finished and bad — `status` is COMPLETED with any OTHER conclusion
          (FAILURE, CANCELLED, TIMED_OUT, ACTION_REQUIRED, STARTUP_FAILURE,
          STALE); or `state` is FAILURE or ERROR.
        - not finished — anything else (QUEUED, IN_PROGRESS, PENDING,
          EXPECTED).
      Judge the WHOLE rollup by that rule and NEVER one check by name. This
      graph runs against whatever repo you point it at, whose checks are named
      whatever they are named; the repo it was written in carries three entries
      where an earlier draft of this node looked only at `test`, and a red one
      of the other two would have been reported green.

      GREEN means BOTH of these hold on `head`:
        - every entry of `checks` is finished and good, and
        - coderabbitai's LATEST review on `head` — among the reviews whose
          `oid` equals `head`, the one with the greatest `at` — is not
          CHANGES_REQUESTED. Recency is the whole rule, not an "is there an
          approval somewhere" search: a PR routinely collects several reviews
          against one commit, and a CHANGES_REQUESTED landing after an
          APPROVED is CodeRabbit changing its mind, which is the answer that
          counts. A "review in progress" placeholder comment is not a
          submitted review and is not in this list.
      RED means at least one entry of `checks` is finished and bad, or
      coderabbitai's latest review on `head` is CHANGES_REQUESTED.
      Anything else — an entry not finished, no coderabbitai review on `head`
      yet — is neither, and is what you keep polling for.

      Do that read FIRST. If triage reported a count of zero (its first line
      is `TRIAGED 0`, however it is decorated) and that read is already green,
      answer immediately: nothing was pushed, so no check will restart and no
      review will be re-requested — there is nothing to re-wait for, and
      polling would spend the whole timeout on a state that cannot change.

      Otherwise poll SYNCHRONOUSLY, in the foreground: run the command, read
      it, then `sleep 30`, then run it again — one loop iteration per tool
      call, blocking each time. NEVER background anything: no `&`, no
      `nohup`, no run_in_background, no "I'll keep polling and report back".
      Your FINAL reply IS the verdict, so you cannot reply until the poll has
      actually reached one — an interim report ends the node and fails it.
      Judge the head SHA of your LAST read, not your first: if someone pushes
      while you poll, the final SHA moved and the checks you were watching
      belong to a commit nobody is merging. Start the judgment over on the
      new head.

      You have 20 minutes, and a loop is a `gh` read plus `sleep 30` plus your
      own turn — call it ~40 seconds, so ~25 loops is about seventeen. When you
      reach either bound, stop polling and answer from the state you actually
      have. Running out the node's timeout instead is the one thing worse than
      an honest UNSETTLED: it kills the node mid-turn, so there is no verdict
      at all and the whole run is discarded — the exact outcome UNSETTLED
      exists to prevent.

      Your reply must START with exactly one of these three verdicts — the
      token as the very FIRST characters, with no markdown emphasis
      (`**RECHECKED**` is WRONG), no heading, no backticks, no preamble —
      followed immediately by the 40-character head SHA you judged:
        - RECHECKED <sha> — GREEN on <sha>: every rollup entry finished good,
          and CodeRabbit's latest word on that commit is not a request for
          changes.
        - BLOCKED <sha> — RED on <sha>; name the entry (or the review) and
          what it says. This FAILS this node deliberately, so the run halts
          here rather than offering the operator a gate over a red PR.
        - UNSETTLED <sha> — the time ran out with the rollup or the review
          still unfinished on <sha>; name which entry and its current status.
      "Still polling" is not a fourth verdict, and neither is a plan to keep
      going: this node's turn ends the moment you reply, so a poll you promise
      to continue is a poll nobody runs. UNSETTLED is what an unfinished wait
      is called here — it asserts that the waiting is OVER and the checks did
      not conclude, which is an outcome. It is not a way to say "not yet" and
      keep the node open, and it is not a cheaper RECHECKED: the operator
      reads it, and the merge that follows a gate approved over it will
      refuse to merge.
      Anything you need to qualify — the short-circuit having found nothing
      to wait for, a caveat, a note — goes AFTER the verdict, never before
      it: a line of context ahead of the token fails this node even when the
      wait is done.
    # Narrower than ready-and-wait's `Bash(gh *)`, which could push, merge or
    # close: this node only reads check state, and `gh pr view` is the whole
    # of what reading check state takes — the rollup, the head SHA and every
    # review's commit come out of one invocation of it. There is no mutating
    # form of `gh pr view` to be narrowed away from (`--jq` runs inside it, so
    # the projection needs no second grant). `sleep` is the poll.
    allowed_tools: ["Bash(gh pr view *)", "Bash(sleep *)"]
    permission_mode: dontAsk
    # 20m, not ready-and-wait's 15m, and the extra five are not padding: the
    # prompt's own budget is ~25 loops at roughly 40s each, which is ~17
    # minutes, so a 15m timeout would kill the node BEFORE it reached the
    # honest answer its instructions ask for. At ready-and-wait that mismatch
    # is harmless — overshoot and the honest answer both fail there. Here the
    # honest answer PASSES and the overshoot discards the run, which is
    # backwards, so the timeout has to outlast the loop budget.
    timeout: 20m
    handoff: artifact
    # Two of the three verdicts pass, so this is an anchored alternation like
    # merge's — but with ONE payload rule factored out of both branches rather
    # than a strong branch and a weak one: whichever way the wait ended, the
    # node has to name the SHA it ended on. A verdict about "the checks" that
    # cannot say which commit they ran against is the exact ambiguity this node
    # was added to remove, so it is not admitted from either side.
    # BLOCKED is deliberately absent from the alternation: red checks are not a
    # passing outcome here, and leaving the token out of the pattern is how the
    # run halts before the gate — the same shape as triage's BLOCKED.
    # Anchored and markdown-tolerant, narrow separator class (a false FAIL here
    # costs one re-run of a read-only poll, so it buys no dashes — see
    # DESIGN.md "Verdict patterns"). The separator is `+`, not `*`: a SHA fused
    # to its token (`RECHECKEDc80872c`) is not a verdict anyone writes, and a
    # `*` there admits it. The hex class takes both cases because `gh` prints
    # lowercase but a model retyping a SHA may not, and refusing a correct
    # verdict over its case buys nothing.
    #
    # What the payload does NOT prove, stated so nobody mistakes it for proof:
    # seven characters of the hex alphabet are typeable, and some of them spell
    # words (`RECHECKED defaced the head` matches). The SHA is here to make the
    # verdict SPECIFIC — to force the node to say which commit it judged — not
    # to be evidence the judging happened. Position is what rejects a promise,
    # here as at merge (ADR 0019 §3).
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s]*(RECHECKED|UNSETTLED)[*_`\s:]+[0-9a-fA-F]{7,40}\b'

  # The human gate: the run stops here with exit 2 after triage's table and
  # recheck's verdict are in. Read them, then
  # `oh-my-graph resume <run-id> --approve approve-merge` (or
  # --reject approve-merge to end the run without merging).
  #
  # CI and review status on the FINAL SHA is no longer yours to confirm — that
  # is what recheck is, and its verdict names the SHA it judged. What is left
  # here is the decision the gate is for: whether this change should land.
  # One thing worth knowing before you type --approve: if recheck came back
  # UNSETTLED, the checks never concluded on that SHA, and merge will answer
  # WITHHELD rather than merge past them. Rejecting is the cheaper answer to
  # UNSETTLED — it ends the run without spending merge's session — and a fresh
  # run once CI has settled is the way back.
  - id: approve-merge
    type: gate
    depends_on: [recheck]

  - id: merge
    type: claude-run
    depends_on: [approve-merge]
    cwd: "{{ inputs.repo }}"
    prompt: |
      The operator has approved the merge of PR #{{ inputs.pr }}. Triage
      reported: {{ artifacts.triage | inline }}.
      Recheck reported: {{ artifacts.recheck | inline }}.
      Recheck is the node that waited out the whole check rollup and CodeRabbit
      on the FINAL SHA, so you do not wait for anything and you do not re-judge
      them. If recheck's verdict begins with UNSETTLED, its wait ran out with
      a check still pending on that SHA: do NOT merge, do NOT poll for it
      yourself, and answer WITHHELD naming the SHA and the check recheck left
      pending. If it begins with RECHECKED, the checks concluded green on the
      SHA named there and you may merge.
        0. Establish the state BEFORE you change it:
           `gh pr view {{ inputs.pr }} --json state,mergeCommit`. If it is
           already MERGED, a previous attempt at this node merged it and then
           failed its own verdict check — do NOT re-enter step 1. Take the
           merge commit SHA from that output, SKIP step 1, and do steps 2-4.
           Confirm the SHA only AFTER step 2 has updated the remote-tracking
           ref, with `git merge-base --is-ancestor <sha> origin/main` — a
           check against a stale or truncated `origin/main` can miss a merge
           that really landed and send this node into a second false FAIL.
           Then report MERGED <sha> for the merge that already landed.
        1. `gh pr merge {{ inputs.pr }} --squash --delete-branch`. Try the
           plain merge first; add `--admin` ONLY if merge-queue mechanics
           require it — that is legitimate here because the review is
           complete by construction (verify passed, CI and CodeRabbit
           concluded, comments triaged), and `--admin` must never be used
           to bypass an unfinished review.
        2. In {{ inputs.repo }}: `git pull --ff-only origin main`.
        3. `make build` — SYNCHRONOUSLY, waiting for the exit code, never
           in the background.
        4. Prune stale local state for this PR: `git remote prune origin`,
           and `git branch -d` the PR's local branch if one exists.
      Run every step in the foreground and finish all of them before you
      answer. Your FINAL reply IS the verdict: this node's turn ends the
      moment you reply, so anything you promise to do afterwards never
      happens. NEVER end on a plan to continue — "I'll proceed as soon as
      the review lands", "poller armed, 30s interval" — that is not a
      verdict, and a reply exactly like it once ended this run green with
      nothing merged. Report the state that is TRUE AS YOU REPLY, as
      exactly one of these two verdicts, whose token must be the very
      FIRST characters of the reply, with no markdown emphasis
      (`**MERGED**` is WRONG), no heading, no backticks, no preamble:
        - MERGED <sha> — the squash merge has landed. The merge commit SHA
          comes immediately after the token with nothing in between
          (`MERGED 4f2a1c9`), then a one-line ledger of what shipped.
        - WITHHELD <reason> — you decided NOT to merge and the PR is still
          open. The blocking fact comes immediately after the token
          (`WITHHELD recheck left test pending on 4f2a1c9`). This is a
          legitimate outcome and it PASSES: refusing to merge past an
          unfinished review is this graph working as designed. It is now a
          FALLBACK, not the routine answer — recheck is what waits, so the
          case that reaches here is an UNSETTLED recheck the operator
          approved over anyway.
      "Not yet" is not a third verdict. If you are tempted to wait for
      something, the honest answer is WITHHELD naming what you are waiting
      for — the operator decides whether to re-run.
      Anything you need to qualify — step 4 finding no local branch to
      delete, a caveat, a note — goes AFTER the verdict, never before it.
      One line of housekeeping ahead of the token failed this node after a
      real merge (run 20260807-144514, PR #135); step 0 makes the re-run of
      that mistake safe, not free — it still costs a whole session.
    # Narrower than every other node's grant: this is the one irreversible
    # mutation in the pipeline, so the only thing it may CHANGE is the merge
    # itself and the local state that follows it. The two read-only commands
    # are what make a false FAIL here cost exactly one re-run, like everywhere
    # else: without them a re-run cannot tell a PR nobody merged from one this
    # node merged before failing its own verdict check, and blindly re-enters
    # `gh pr merge`. They add no mutation — see step 0 and ADR 0019.
    allowed_tools:
      - "Bash(gh pr view *)"
      - "Bash(git merge-base *)"
      - "Bash(gh pr merge *)"
      - "Bash(git pull *)"
      - "Bash(git remote prune *)"
      - "Bash(git branch -d *)"
      - "Bash(make build)"
    permission_mode: dontAsk
    timeout: 15m
    handoff: artifact
    # Two legitimate outcomes, one anchored alternation: it merged, or it
    # deliberately did not. What the shape exists to reject is the reply
    # that is NEITHER — the "re-review is mid-flight, I'll proceed as soon
    # as it lands" promise, which under a bare `exit_zero: true` passed,
    # recorded a successful merge step in the ledger, and merged nothing.
    # MERGED must carry a commit SHA: a merge that really happened leaves
    # one, a merge the node only intends does not. The SHA comes from step
    # 2's `git pull --ff-only` range, which is the whole reason that step is
    # inside this node's grant — narrowing it would leave the node unable to
    # produce the evidence its own verdict requires.
    #
    # The separator class admits `-` and `—` here and nowhere else in this
    # repo, because this node is the one place a false FAIL is not merely a
    # retry: `MERGED — 4f2a1c9` after a real merge would fail a node whose
    # re-run re-enters `gh pr merge` on an already-merged PR, under a grant
    # too narrow to even look at what happened. Dashes cost nothing to admit
    # — the SHA is still the gate, so `MERGED — the squash is queued` fails
    # exactly as before — and the tokens contain no dash of their own, so
    # DESIGN.md's token-choice rule is untouched.
    #
    # That widened class is also why WITHHELD closes on `[[:alnum:]]` rather
    # than `\S`: a greedy separator run can always hand its own last
    # character back to `\S`, so `WITHHELD:` and `WITHHELD —` would pass
    # carrying no reason — the token with the blocking fact stripped out of
    # it. An alnum cannot be a separator, and every decoration a real reason
    # is written behind is still absorbed on the way to it.
    #
    # The anchor is `^`, over the whole REPLY, like every other verdict in
    # this repo. Relaxing it to `(?m)` — matching per line, so PR #135's
    # verdict-on-line-3 would have passed — was measured and REFUSED, because
    # the SHA is not the promise-proof payload it looks like:
    #
    #   $ MERGED 4f2a1c9        # the example six lines up, quoted back
    #   $ MERGED <PR head SHA>  # exists before the squash does
    #
    # Seven hex characters are producible by a model that has merged nothing.
    # Under `^` a promise cannot reach them, because a promise is preamble
    # first by construction — "I'll merge when the review lands" comes before
    # the quote of what the reply will say. Under `(?m)` that preamble is
    # free, and five constructed promise replies (a plan listing both
    # verdicts as bullets, an indented code block quoting the instruction, a
    # "will be" sentence carrying the PR head SHA) all pass. Position IS the
    # lock here, same as for a bare-word verdict. ADR 0019 has the replay.
    #
    # The false FAIL that prompted the question is paid for in step 0 and in
    # this node's grant instead, which is the honest place: the pattern was
    # never wrong about PR #135's reply, the re-run was just expensive.
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s\-—]*(MERGED[*_`\s:\-—]*[0-9a-f]{7,40}\b|WITHHELD[*_`\s:\-—]*[[:alnum:]])'
