# dev-review-pr — the worked example: a small delivery pipeline as a DAG.
#
#   dev  ──▶  e2e  ──▶  review-security ─┐
#                  └─▶  review-style ────┴─▶  pr
#
# Handoff choices illustrate both strategies:
#   - e2e resumes dev's claude session (handoff: session) — tight sequential
#     continuation in the same working tree, so e2e sees exactly what dev did.
#   - the two reviews and the pr node read upstream results as artifacts
#     (the default) — a fan-in cannot merge sessions, so it MUST use artifacts.
#
# The parallel reviews run read-only (permission_mode: plan) because parallel
# nodes share one working tree and concurrent edits would race. Parallel EDIT
# lanes should each declare `worktree: <name>` instead, which gives every lane
# its own managed git checkout (see "worktree" in README).
#
# Run:
#   oh-my-graph run graphs/dev-review-pr.yaml --input repo=/path/to/your/repo
name: dev-review-pr
version: "0.1"
inputs: [repo]
concurrency: 4
nodes:
  - id: dev
    type: claude-run
    cwd: "{{ inputs.repo }}"
    prompt: |
      Implement the change described in the current issue/branch. Keep the diff
      focused. Choose a commit granularity that fits the work — one commit per
      refactoring unit for refactors, per file for sweeps, per feature slice
      for new code — and state your choice in the first commit message. Commit
      as you go: a node timeout must never lose finished work. End every commit
      message with the trailer `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>`
      (the attribution convention in CONTRIBUTING.md).
      Your FINAL reply IS the verdict: this node's turn ends the moment you
      reply, so work you promise to do afterwards never happens. Never end on
      a plan to continue — report the state that is TRUE AS YOU REPLY. When
      the change is committed, START your reply with the bare word DONE —
      those four characters FIRST, no markdown emphasis (`**DONE**` is WRONG),
      no heading, no preamble — then a one-line summary of what you changed.
      Anything you need to qualify goes AFTER the verdict, never before it:
      a line of context ahead of the token fails this node even when the
      work is done.
      If it is not finished, do NOT write DONE: start with a bare BLOCKED and
      the current state.
    allowed_tools: [Read, Edit, Write, "Bash(git *)"]
    permission_mode: dontAsk
    timeout: 1h  # the hang guard — generous, so real work is never killed mid-flight
    handoff: artifact
    # Anchored, markdown-tolerant (DESIGN.md "Verdict patterns"): without it,
    # "I've started; I'll finish the tests next" passes as a completed dev node
    # and the reviews downstream review half a change.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*DONE\b' }

  # The proven gate/review shapes are fragments (ADR 0013): the prompt, the
  # grant and the evidence-grounded success_check live once, in
  # graphs/fragments/<name>.yaml, and only the per-graph spans are bound
  # here. `lint` still warns on e2e (handoff: session + retry) — that is
  # advisory and expected: a retried attempt starts cold instead of resuming
  # dev's session, and the fragment's prompt is written to survive exactly
  # that case.
  - id: e2e
    use: e2e-verify
    depends_on: [dev]
    cwd: "{{ inputs.repo }}"
    with:
      checks: |-
        run the end-to-end checks (make local). If the
        diff touches concurrency-sensitive code, also stress its tests (e.g.
        `go test <affected packages> -race -count=300`, or your stack's
        equivalent) — a flaky test passes a single run, and determinism is
        the claim under test.
      verify_command: make local

  - id: review-security
    use: review-security
    depends_on: [e2e]
    cwd: "{{ inputs.repo }}"
    with:
      diff: the current diff
      evidence: "{{ artifacts.e2e | inline }}"

  - id: review-style
    use: review-style
    depends_on: [e2e]
    cwd: "{{ inputs.repo }}"
    with:
      diff: the current diff
      focus: ""   # no extra focus paragraph in the generic pipeline

  - id: pr
    type: claude-run
    depends_on: [review-security, review-style]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Open a pull request for the current branch. Incorporate these reviews into
      the PR body:
        Security review: {{ artifacts.review-security | inline }}
        Style review:    {{ artifacts.review-style | inline }}
      Open it BEFORE you reply: your FINAL reply IS the verdict, so a PR you
      promise to open afterwards is never opened. START your reply with the
      bare token PR followed immediately by the pull request's URL
      (`PR https://github.com/owner/repo/pull/123`) — those characters FIRST,
      with no markdown emphasis (`**PR**` is WRONG), no heading, no preamble.
      Anything you need to qualify goes AFTER the URL, never before it: a
      line of context ahead of the token fails this node even when the PR
      is open.
    allowed_tools: [Read, "Bash(git *)", "Bash(gh *)"]
    permission_mode: dontAsk
    handoff: artifact
    # The URL is the payload that makes this an assertion: gh prints one only
    # once the PR exists, so "I'll open it after CI goes green" cannot match.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*PR[*_`\s:]*https?://\S' }
