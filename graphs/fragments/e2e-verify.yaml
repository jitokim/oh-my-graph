# e2e-verify — the cold-safe e2e gate (ADR 0013's founding shape).
#
# The first sentence is the cold-safe retry wording: a retried attempt starts
# cold instead of resuming its session-parent, and the prompt is written to
# survive exactly that case. It used to be hand-swept across every template;
# it now exists once, here.
#
# What stays per-graph is what only the graph can know: `checks` (the checks
# this gate asks for, in prose) and `verify_command` (the command the ENGINE
# runs as evidence). The command is bound rather than hardcoded because this
# fragment is meant to travel: `make local` is this repo's build, not every
# repo's, and a gate that names the wrong command is not a gate. Bind it from
# an input or a literal, never from an artifact: the ENGINE runs the command
# through `sh -c`, so an artifact binding would hand a model's own output
# straight to a shell. Everything else is the proven shape: session
# continuation, synchronous execution, a verdict-only final reply, and an
# evidence-grounded success_check whose failure is a retry cause (the engine
# runs `verify` itself and judges the exit code, so a node that reports PASS
# without the suite passing does not pass).
# It carries `handoff: session` (below): a node citing it needs exactly one
# parent, or load refuses it — a root must override `handoff: artifact` (#268).
fragment: e2e-verify
description: cold-safe e2e gate — session continuation, synchronous checks, verified verdict
substitutions: [checks, verify_command]
node:
  type: claude-run
  prompt: |
    Continue the work — or, on a retried attempt, start from the branch's
    committed state — and {{ with.checks }}
    Run every check SYNCHRONOUSLY and wait for it to finish — never in the
    background.
    If you stress tests (repeated runs under the race detector, or your
    stack's equivalent), DERIVE the repetition count from this budget —
    never copy a fixed one:
      1. BUDGET. This node is killed at 20 minutes, and a node killed by
         its own timeout produces NO verdict at all. Spend at most half of
         that on stress, and leave the rest for the checks and the verdict.
      2. DERIVE. Time ONE repetition of each package first (`-count=1`),
         then pick a per-package count that fits step 1. A smaller count
         that finishes beats a larger one that is killed.
      3. RAISE THE PER-TEST TIMEOUT. `go test` kills a package after 10
         minutes BY DEFAULT and prints FAIL — a failure that never
         happened. Pass `-timeout` ABOVE your step-1 budget and BELOW this
         node's bound (`go test <pkg> -race -count=<n> -timeout 12m`).
    Your FINAL reply is the verdict: never end the turn on an
    interim report. If everything succeeds, your reply is exactly the four
    bare characters PASS and nothing else — no markdown emphasis (`**PASS**`
    is WRONG), no heading, no backticks, no preamble. Otherwise reply FAIL,
    equally bare, as the very first characters, followed by the failing step.
  # A check gate gets the verbs a check gate runs, and nothing else. The wide
  # forms this replaced were `Bash(go *)` — which includes `go run`, i.e.
  # execute arbitrary code out of the tree under review — and `Bash(git *)`,
  # which includes push, reset and history rewriting in a node whose only job
  # is to report PASS or FAIL. Neither is reachable from anything this prompt
  # asks for: the gate has no Edit/Write, so it cannot fix what it finds, and
  # the evidence command is run by the ENGINE (success_check.verify), not by
  # the node. Git is read-only here for the same reason.
  #
  # A non-Go repo adopting this fragment overrides `allowed_tools` on its using
  # node — the override is announced in the disclosure line at every run, which
  # is the point: widening a grant should be visible, not inherited silently.
  allowed_tools: [Read, "Bash(make *)", "Bash(go build *)", "Bash(go test *)", "Bash(go vet *)", "Bash(git status*)", "Bash(git diff*)", "Bash(git log*)"]
  permission_mode: dontAsk
  # Runaway insurance ONLY, never cost tuning: a tight budget kills a
  # nearly-done node at the threshold, and the salvage costs more than
  # letting it finish (a real $0.02-over kill cost ~6x the remaining work).
  # Keep this an order of magnitude above a plausible run. The hang guard
  # is `timeout:`, not the budget.
  budget_usd: 10.00
  # Declared, not inherited, though it is the runner's own 20m default: the
  # prompt above quotes this bound so the node can size its stress run
  # against it (#292), and a prompt cannot be checked against a number the
  # fragment never states. Move the two together —
  # TestE2EVerifyStressBudgetMatchesItsTimeout reads both off every shipped
  # node that splices this fragment.
  timeout: 20m
  handoff: session
  success_check:
    exit_zero: true
    # Secondary: the node's own account of itself. Anchored at both ends so
    # a FAIL report or a passing mention of the word cannot read as a pass —
    # but tolerant of the markdown a model emits unbidden (`**PASS**` has
    # halted a real run), because the pattern is the backstop and the prompt
    # above is the instruction.
    result_matches: '^[*_`\s]*PASS[*_`\s]*$'
    # The evidence. The engine runs this itself and judges the exit code,
    # so a node that reports PASS without the suite passing does not pass.
    verify: { command: "{{ with.verify_command }}", timeout: 5m }
  retry: { max: 1, on: [nonzero_exit, verify_failed] }
