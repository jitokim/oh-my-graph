# pr-publish — the node that opens the pull request and proves it with a URL.
#
# ADR 0013's corpus mining named this shape ("the pr-publish node") and the
# migration then skipped it, on the grounds that `dev` and `pr` "diverge more
# than they share". That was true of `dev` and measurably false of `pr`: the
# four shipped PR nodes share the 83 words below word-for-word — 75% of the
# shortest of the four prompts, and pairwise they run 78-89% — and all four
# declare the same grant, the same permission mode, the same handoff and the
# same success_check. What differs is one paragraph.
#
# So that paragraph is what binds. `publish` is the graph's own instruction —
# which branch to push, whether the pull request is a DRAFT, and what goes in
# the body. The body is the reason it cannot be hardcoded here: it names
# graph-local node ids (`{{ artifacts.review-a | inline }}`), which is wiring,
# the same reason review-security binds `evidence` rather than naming an
# upstream node itself. A bound runtime placeholder survives resolution
# untouched and interpolates at run time as always.
#
# Everything else is the proven shape: the turn-ends-at-the-reply discipline,
# the URL as the payload that makes the token an assertion, and a grant that
# lets this node publish but never fix — no write to the tree, only to one
# untracked file, the PR body — stated in the prompt word for word, because under
# dontAsk a node that does not know its grant gives up at the first denial
# (#294). A node that also
# has to CHANGE the tree before it opens the PR is a different shape and says
# so honestly by staying inline; `adr-driven-dev`'s `finalize` is the one in
# this repo (it applies the last review's remaining flags, and gates on an
# engine-run `make local`).
fragment: pr-publish
description: publish the branch as a pull request — the URL is the payload that makes the verdict an assertion
substitutions: [publish]
node:
  type: claude-run
  prompt: |
    {{ with.publish }}
    Your grant is exactly this: `git`, `gh`, Read, and writing ONE file,
    `.omg-pr-body.md` in your working directory. Any other call is denied,
    not asked about. A body passed inline is denied even though it starts
    with `gh`: a multi-line `--body '…'`, a heredoc and a `$(…)` are all
    refused. So the body goes through that file, in this order:
      1. Write the whole body to `.omg-pr-body.md` with the Write tool (if
         an earlier run left one there, Read it first, then overwrite it).
      2. Run `gh pr create --title '<one line>' --body-file .omg-pr-body.md`,
         plus any other flag asked for above (such as `--draft`).
      3. Never `git add` or commit `.omg-pr-body.md`; it is not part of the
         change.
    Every Bash call is ONE program: no `cd`, `&&`, `;`, `|`, redirect or
    heredoc. To act in another directory, use `git -C <dir>`. A denied call
    means the FORM was wrong, not the goal: re-issue it in the form above
    before you give up on it.
    Open it BEFORE you reply: your FINAL reply IS the verdict, so a PR you
    promise to open afterwards is never opened. START your reply with the
    bare token PR followed immediately by the pull request's URL
    (`PR https://github.com/owner/repo/pull/123`) — those characters FIRST,
    with no markdown emphasis (`**PR**` is WRONG), no heading, no preamble.
    Anything you need to qualify goes AFTER the URL, never before it: a
    line of context ahead of the token fails this node even when the PR
    is open.
  # Publish, never fix: `gh` and `git` to push and open, `Read` to write a body
  # that describes the diff. No unscoped Edit/Write — a node that reaches the
  # end of a pipeline and starts editing is re-opening work every review
  # upstream has already judged, and nothing downstream would review the result.
  #
  # The one write it holds is the body file, and only that path (#294). Under
  # dontAsk the body had no permitted route at all: an inline multi-line
  # `--body` was denied under a matching `gh` grant 9 times in one real run
  # (docs/measurements/0213b, class C), a heredoc or `$(cat …)` is compound,
  # and `--body-file` needs a file this node could not create. `.git/` is no
  # home for it either, since `.git` is a FILE in a linked worktree. Claude
  # Code's `Edit(<path>)` rule is the one that covers the Write tool, and `./`
  # anchors it to the node's working directory. That spelling follows the
  # CLI's documented rule syntax and has not been measured here.
  allowed_tools: [Read, "Bash(git *)", "Bash(gh *)", "Edit(./.omg-pr-body.md)"]
  permission_mode: dontAsk
  handoff: artifact
  # The URL is the payload that makes this an assertion: `gh` prints one only
  # once the PR exists, so "I'll open it after CI goes green" cannot match.
  # Anchored and markdown-tolerant (DESIGN.md "Verdict patterns"), with the
  # separator class between token and payload kept narrow — a false FAIL here
  # costs one re-run, which is the currency that buys any widening.
  success_check: { exit_zero: true, result_matches: '^[*_`\s]*PR[*_`\s:]*https?://\S' }
