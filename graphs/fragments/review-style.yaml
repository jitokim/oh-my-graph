# review-style — the read-only style/naming/simplicity review of a diff,
# with the test-double discipline check built in (CONTRIBUTING's rule: every
# synchronization field wired, no assertion satisfiable by absence).
#
# Per-graph spans stay declared: `diff` (which diff this graph reviews) and
# `focus` (the extra focus paragraph a graph adds — repo invariants, a
# subsystem to stare at; bind "" when there is none).
#
# The prompt quotes {{ self.previous }} — this reviewer's own reply from the
# previous feedback round — because a re-run reviewer is a fresh session: without
# its earlier findings it judges the reworked diff as a stranger, finds new nits
# every round, and a CLEAN-gated loop never converges (#288). It needs no
# binding and names no id, so it is empty wherever the citing graph declares no
# arc — every advisory lane. The engine fences and bounds the quote like a
# retry's (DESIGN.md "Handoff"), and it sits BEFORE the verdict-format rule so
# that rule, not the reviewer's own old output, is the last thing it reads.
fragment: review-style
description: read-only style/naming/simplicity review of a diff, with the test-double discipline check
substitutions: [diff, focus]
node:
  type: claude-run
  prompt: |
    Review {{ with.diff }} for style, naming, and simplicity.
    {{ with.focus }}
    If the diff adds or edits test doubles or concurrency tests, also verify:
    every synchronization field is actually wired (no dead channels, no
    wall-clock fallback arms) and no assertion is satisfiable by a record or
    node simply being absent.

    Your own reply from the previous review round of this diff follows — it
    is empty on the first pass. If present, the diff was reworked to answer
    it: first check each of those findings and re-raise only the ones still
    open. Raise a NEW finding only where the rework changed the code, or
    where missing it last round was a real mistake — not a nit you could
    have raised then and did not. If every earlier finding is closed and
    nothing new meets that bar, the verdict is CLEAN.
    {{ self.previous }}

    Finish the review BEFORE you reply. Your FINAL reply IS the verdict: this
    node's turn ends the moment you reply, so a part of the diff you promise
    to look at afterwards is never looked at. Never end on "I'll continue" —
    report what you have actually judged. START the reply with exactly one of
    these two bare tokens, as the very FIRST characters, with no markdown
    emphasis (`**CLEAN**` is WRONG), no heading, no preamble:
      - CLEAN — you reviewed the whole diff and found nothing worth changing.
      - FINDINGS: — followed by a short bulleted list, worst first.
    Anything you need to qualify goes AFTER the token, never before it: a
    line of context ahead of it fails this node even when the review is
    finished.
  allowed_tools: [Read, "Bash(git diff*)", "Bash(git log*)"]
  permission_mode: plan
  handoff: artifact
  # Either verdict passes — a review's job is to judge, not to be clean — but
  # a reply that is neither (an interim "still reviewing") fails. Anchored,
  # and tolerant of emphasis on either side of the colon, `**FINDINGS:**` and
  # `**FINDINGS**:` alike (DESIGN.md "Verdict patterns").
  #
  # That makes this fragment ADVISORY, and it says so here because the
  # consequence is not local: a passing `FINDINGS:` reaches none of the engine's
  # three "the reviewer rejected the work" mechanisms — `retry`, `feedback` and
  # `on_fail` all hang off FAILURE — so every node downstream of a using node
  # runs regardless, including a PR node. Whether that is right is the CALLER's
  # question, and the caller is the only one who can answer it: a graph that
  # wants findings to stop its pipeline narrows this check on its own node
  # (`success_check: { exit_zero: true, result_matches: '^[*_`\s]*CLEAN\b' }`,
  # announced in the run's disclosure line) AND gives that node a `feedback:`
  # arc back to the implementing node — which no fragment may declare, ADR 0013
  # counting feedback as graph-local wiring. Ship the pair or neither: a
  # narrowed check with no arc makes a reviewer that did its job report a
  # broken run. `backlog-batch` shows both dispositions — lane A gates, lane B
  # keeps this default deliberately.
  success_check: { exit_zero: true, result_matches: '^[*_`\s]*(FINDINGS[*_`\s]*:|CLEAN\b)' }
