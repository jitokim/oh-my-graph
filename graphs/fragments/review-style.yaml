# review-style — the read-only style/naming/simplicity review of a diff,
# with the test-double discipline check built in (CONTRIBUTING's rule: every
# synchronization field wired, no assertion satisfiable by absence).
#
# Per-graph spans stay declared: `diff` (which diff this graph reviews) and
# `focus` (the extra focus paragraph a graph adds — repo invariants, a
# subsystem to stare at; bind "" when there is none).
fragment: review-style
description: read-only style/naming/simplicity review of a diff, with the test-double discipline check
substitutions: [diff, focus]
node:
  type: claude-run
  prompt: |
    Review {{ with.diff }} for style, naming, and simplicity.
    {{ with.focus }}
    If the diff adds or edits test doubles or concurrency tests, also verify:
    every synchronization field is actually wired (no dead channels, no
    wall-clock fallback arms) and no assertion is satisfiable by a record or
    node simply being absent.
    Finish the review BEFORE you reply. Your FINAL reply IS the verdict: this
    node's turn ends the moment you reply, so a part of the diff you promise
    to look at afterwards is never looked at. Never end on "I'll continue" —
    report what you have actually judged. START the reply with exactly one of
    these two bare tokens, as the very FIRST characters, with no markdown
    emphasis (`**CLEAN**` is WRONG), no heading, no preamble:
      - CLEAN — you reviewed the whole diff and found nothing worth changing.
      - FINDINGS: — followed by a short bulleted list, worst first.
    Anything you need to qualify goes AFTER the token, never before it: a
    line of context ahead of it fails this node even when the review is
    finished.
  allowed_tools: [Read, "Bash(git diff*)", "Bash(git log*)"]
  permission_mode: plan
  handoff: artifact
  # Either verdict passes — a review's job is to judge, not to be clean — but
  # a reply that is neither (an interim "still reviewing") fails. Anchored,
  # and tolerant of emphasis on either side of the colon, `**FINDINGS:**` and
  # `**FINDINGS**:` alike (DESIGN.md "Verdict patterns").
  success_check: { exit_zero: true, result_matches: '^[*_`\s]*(FINDINGS[*_`\s]*:|CLEAN\b)' }
