# backlog-batch — the parallel multi-lane batch idiom, as a documented
# skeleton you copy and grow (two example lanes; add lane-c the same way).
#
#   dev-a ──▶ e2e-a ──▶ review-a ──▶ pr-a     (feature lane, worktree lane-a)
#   dev-b ──▶ e2e-b ──▶ review-b ──▶ pr-b     (docs lane,    worktree lane-b)
#
# Each lane runs in its OWN managed git worktree (branched off the invocation
# repo's HEAD), so the lanes edit fully in parallel and each ends in its own
# PR. Invoke from inside the target repo and pass repo="$PWD".
#
# The hard-won rules of the idiom — learned by breaking each one once.
# Each carries its DISPOSITION: what mechanically checks it, or why nothing
# can without changing the schema. A rule that stays prose is not a rule that
# stopped mattering — it is one whose subject the loader cannot see.
#
#   1. Lanes must not share files. Two lanes touching one file merge-conflict
#      at PR time and can silently undo each other. Dedupe file ownership at
#      authoring time — or, if two tasks genuinely overlap, serialize them
#      into one lane (make dev-b depend on pr-a) instead of parallelizing.
#      STAYS PROSE: no key in the node schema names the files a lane owns
#      (`internal/graph/graph.go`), so a checker would have to read paths out
#      of prompt prose — and here that prose arrives at run time, bound by
#      `--input task_a`/`task_b`, which `lint` is never given.
#   2. Phased commits. Every dev prompt has the node CHOOSE a commit
#      granularity fitting its work and commit as it goes: a node timeout must
#      never lose finished work, and worktree cleanup only preserves a lane's
#      branch if it gained commits. The hang guard is a generous `timeout:`,
#      not a tight `budget_usd` — a tight budget kills a nearly-done node at
#      the threshold, and the salvage costs more than letting it finish.
#      STAYS PROSE: "the node CHOOSES a granularity" is an instruction inside
#      a prompt, and the half that looks structural is false on a file this
#      graph cites — `graphs/fragments/e2e-verify.yaml` declares `budget_usd`
#      and NO `timeout:` for a reason it argues in place, so "a budget without
#      a timeout" would warn on the shipped fragment that is doing it right.
#   3. Cold-safe session prompts. An e2e node that resumes its dev session
#      AND declares retry starts cold on the retried attempt (`lint` warns,
#      advisory) — so every session prompt here opens with the
#      continue-or-start-from-committed-state form and survives that case.
#      That wording is no longer restated per lane: both gates cite the
#      `e2e-verify` fragment (ADR 0013), so the shape is fixed once, upstream,
#      and a lane declares only what is genuinely its own.
#      CHECKED BY `handoff.LintSessions` (internal/handoff/session_lint.go):
#      its predicate is exactly `handoff: session` + `retry.max > 0`, and it
#      fires on both gates here — the two warnings the note at lane A calls
#      advisory and expected. The other half — whether the prompt REALLY
#      survives a cold start — is a reading, not a predicate, and stays prose.
#   4. Stress runs for concurrency diffs. A lane whose diff touches
#      concurrency-sensitive code must stress the affected tests
#      (`go test <pkgs> -race -count=300`, or your stack's equivalent) —
#      a flaky test passes a single run; determinism is the claim under test.
#      STAYS PROSE: the rule's subject is the lane's DIFF, which does not
#      exist when the graph is loaded and which the engine never reads at any
#      point, so all a checker could match is a literal phrase in a prompt.
#   5. Independent lanes fail independently. A batch of independent lanes
#      should declare `on_fail: continue` (as this graph does): one lane's
#      failure must not halt the others' unrelated work. Dependency edges
#      still hold — a failed node's own downstream nodes never run.
#      STAYS PROSE, and measured rather than assumed: the obvious predicate —
#      "≥2 weakly connected components in the resolved `depends_on` closure
#      AND no `on_fail: continue`" — scored 1 hit / 0 real / 1 noise over 51
#      graphs and was rejected on STRUCTURE, not on that sample: the planner's
#      reply schema has no graph-level key at all, so no planned graph can
#      ever satisfy the second conjunct and the warning would be a constant
#      they cannot turn off. Its one hit was a pipeline missing `depends_on`
#      edges, where "declare on_fail: continue" is the opposite of the repair
#      — and `handoff.LintPlaceholders` already prints the right one.
#      docs/measurements/0034b-independent-lane-failure-predicate.md.
#   6. A review is ADVISORY unless the lane says otherwise. The `review-style`
#      fragment passes on BOTH its verdicts — `CLEAN` and `FINDINGS:` —
#      because a review's job is to judge, not to be clean. Nothing else reads
#      a verdict: `depends_on` is a success edge, and `retry`, `feedback` and
#      `on_fail` all hang off FAILURE, so a passing `FINDINGS:` reaches none
#      of them and the lane opens its PR regardless. A lane that wants
#      findings to stop it therefore has exactly one spelling, and it is a
#      PAIR: narrow the review's `success_check` to the clean verdict, and
#      give that same node a `feedback:` arc saying what to do about the
#      failure. Ship both or neither — a narrowed check with no arc turns a
#      reviewer that did its job into a failed run.
#      Lane A gates and lane B advises, and the two are now spelled
#      DIFFERENTLY, which is the point of rule 7. Lane A's whole shape — the
#      pair included — is the `gated-lane` fragment; lane B stays written out,
#      because a substitution point can bind a value and can never make a
#      `feedback:` key present or absent, so one fragment cannot serve both
#      dispositions. Read the pair's reasoning in graphs/fragments/gated-lane.yaml,
#      beside the two keys it is made of. The arc's price is stated there too:
#      the body is (1 + max) × 3 lane nodes — 6 for `max: 1` — and the honest
#      worst case is 8, because the gate brings a `retry:` of its own.
#      CHECKED BY `TestAGatingReviewCarriesItsRecoveryArc`
#      (internal/graph/shipped_graphs_test.go) — a test over the graphs in
#      this repo, deliberately NOT a shipped sweep: a narrowed check with no
#      arc is a defect in THESE graphs and a legitimate choice in a user's, so
#      the failure belongs to this build, not to their run. It sees only nodes
#      that splice a `review-*` fragment; a hand-written review and a review
#      nested inside a multi-node fragment stay prose (the test says so too).
#   7. A lane whose SHAPE repeats is a fragment; a lane that differs in a KEY
#      is not. Lane A is four nodes of which three were already `use:`
#      citations, so folding it needed a fragment that cites fragments
#      (ADR 0029) — and having one, lane A is now a single node. Lane B is the
#      same four nodes and does NOT fold, for a reason worth keeping in front
#      of the next author: it advises where lane A gates, and that difference
#      is the presence of two keys rather than the value of one. When a lane
#      resists conversion, check which of the two it is before forcing it.
#      STAYS PROSE: telling a repeated SHAPE from a differing KEY is the
#      judgement this rule exists to provoke, and a predicate that answered it
#      would answer it wrongly for lane B, which repeats every node and still
#      must not fold. The gating shape is ALREADY COVERED as a citable
#      fragment — `graphs/fragments/gated-lane.yaml`, which lane A cites — and
#      no second, advisory-lane fragment is built because an advisory lane is
#      defined by the ABSENCE of the review's `feedback:` arc and its narrowed
#      `success_check`, and a substitution point can only bind a value, never
#      make a key present or absent; folding lane B into `gated-lane` would in
#      fact be REFUSED by the loader, since that fragment's dev prompt quotes
#      `{{ feedback.review }}` and a token pointing at a node that declares no
#      arc is a load error (internal/graph/feedback.go).
#
# `checks_command` is the command the ENGINE runs as each gate's evidence
# (success_check.verify) — your stack's full-check target, e.g. `make local`,
# `npm test`, `cargo test`. It is an input rather than a hardcoded string
# because this skeleton is meant to be copied into any repo, and a gate that
# names the wrong command is not a gate: the node's own "PASS" is only its
# account of itself, and the verify exit code is what actually judges it.
#
# Run (from inside the repo, so the worktrees branch off its HEAD):
#   oh-my-graph run graphs/backlog-batch.yaml \
#     --input repo="$PWD" \
#     --input checks_command="make local" \
#     --input task_a="implement <feature>" \
#     --input task_b="update <docs> to match"
#
# VERDICT — already covered by a shipped fragment? PARTIALLY. Lane A's gating
# shape IS graphs/fragments/gated-lane.yaml (its arc at :140, its narrowed check
# at :126, {{ feedback.review }} quoted at :81). Lane B's ADVISORY shape is not,
# and earns no twin: a multi-node use: declares wiring only (fragment.go:439).
name: backlog-batch
version: "0.1"
inputs: [repo, checks_command, task_a, task_b]
concurrency: 4
on_fail: continue  # rule 5: independent lanes — one lane's failure must not halt the rest
nodes:
  # ---- lane A: feature lane (worktree lane-a) -------------------------------
  #
  # One node, four spliced: `lane-a/dev`, `lane-a/e2e`, `lane-a/review`,
  # `lane-a/pr`. The whole gating shape — the wiring, the narrowed review check
  # and its `feedback:` arc, and the three fragments the middle nodes themselves
  # cite — is `graphs/fragments/gated-lane.yaml`, which is the first fragment
  # that cites fragments (ADR 0029). What is left here is what only this graph
  # can know: which repo, which task, which verbs the implementer needs, which
  # checks are this lane's, and what its PR should say.
  #
  # `worktree:` stays here, on the citing node, and propagates to every node the
  # splice emits — including the ones a level further down. `lint` still warns
  # about the gate (handoff: session + retry) — advisory and expected: a retried
  # attempt starts cold, and `e2e-verify`'s prompt survives exactly that case
  # (rule 3 above).
  - id: lane-a
    use: gated-lane
    worktree: lane-a
    with:
      repo: "{{ inputs.repo }}"
      task: "{{ inputs.task_a }}"
      # A Go lane's verbs. A lane in another stack binds its own, and the
      # resolved grant is announced in the run's disclosure line at the id that
      # runs with it (#196).
      tools: [Read, Edit, Write, "Bash(git *)", "Bash(go *)", "Bash(make *)"]
      checks: |-
        run the project's full checks (build + test + lint). If the diff
        touches concurrency-sensitive code, ALSO stress the affected tests
        (`go test <pkgs> -race -count=300`, or your stack's equivalent) —
        rule 4 in this graph's header.
      verify_command: "{{ inputs.checks_command }}"
      focus: |-
        Judge correctness as well, and scope: the diff must serve only this
        lane's task — flag anything that strays into files another lane
        could own.
      publish: |-
        Push this worktree's branch and open a DRAFT pull request with
        `gh pr create --draft`. Put the review in the PR body:

  # ---- lane B: docs lane (worktree lane-b) ----------------------------------
  #
  # Written out, and that is rule 7 rather than an oversight: this lane ADVISES
  # where lane A gates, and the difference is two keys' PRESENCE — a narrowed
  # `success_check` and a `feedback:` arc — which no substitution point can bind
  # into or out of existence. It still cites the same single-node fragments lane
  # A's fragment does, so the gate and review shapes cannot drift between the
  # two lanes; only the disposition differs.
  - id: dev-b
    type: claude-run
    worktree: lane-b
    prompt: |
      You are in an isolated git worktree of the repo {{ inputs.repo }},
      on a fresh branch. Do this documentation task, touching ONLY the files
      this task owns (another lane edits code in parallel — do not stray
      into its territory):
        {{ inputs.task_b }}
      Choose a commit granularity that fits the work — per file for sweeps,
      per doc section for larger rewrites — and state your choice in the
      first commit message. Commit as you go, staging only the files you
      changed, by explicit path (`git add <path> ...`) — never `git add -A`,
      `git add .`, or `git add -u`. End every commit message with the trailer
      `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>` (the attribution
      convention in CONTRIBUTING.md).
      Your FINAL reply IS the verdict: this lane's node ends the moment you
      reply, so work you promise to do afterwards never happens. Never end on
      a plan to continue — report the state that is TRUE AS YOU REPLY. When
      the docs change is committed, START your reply with the bare word DONE —
      those four characters FIRST, no markdown emphasis (`**DONE**` is WRONG),
      no heading, no preamble — then a one-line summary of what you changed.
      Anything you need to qualify goes AFTER the verdict, never before it:
      a line of context ahead of the token fails this node even when the
      work is done.
      If it is not finished, do NOT write DONE: start with a bare BLOCKED and
      the current state, so this lane stops instead of shipping half a task.
    allowed_tools: [Read, Edit, Write, "Bash(git *)"]
    permission_mode: dontAsk
    timeout: 1h  # the hang guard — generous, so real work is never killed mid-flight
    handoff: artifact
    # Same anchored, markdown-tolerant shape as lane A's dev node.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*DONE\b' }

  # Same fragments as lane A, same advisory warning — only the bindings differ.
  # That is the point: the two lanes' gates can no longer drift apart.
  - id: e2e-b
    use: e2e-verify
    depends_on: [dev-b]
    worktree: lane-b
    with:
      checks: |-
        check the docs changes: every renamed or moved reference resolves,
        examples still match the code they cite, and the project's checks
        still pass — docs edits can break embedded snippets and lint gates
        too.
      verify_command: "{{ inputs.checks_command }}"

  - id: review-b
    use: review-style
    depends_on: [e2e-b]
    worktree: lane-b
    with:
      diff: this worktree's diff vs its base
      focus: |-
        Judge accuracy against the code it documents, tone consistency, and
        scope: docs files only — flag anything that strays into code another
        lane could own. The e2e verdict was: {{ artifacts.e2e-b | inline }}
    # Rule 6, lane B's half: this lane ADVISES. Left exactly as the fragment
    # ships — either verdict passes — but as a decision rather than an
    # unexamined default: the findings reach the draft PR's body, which is
    # where a human reads a docs review anyway, and a wording flag does not
    # earn a second dev round. So `pr-b` opens on `FINDINGS:`, deliberately,
    # and lane B's PASS row does not claim the docs were clean.

  # Same fragment as lane A's PR node — only the review it quotes differs.
  - id: pr-b
    use: pr-publish
    depends_on: [review-b]
    worktree: lane-b
    with:
      publish: |-
        Push this worktree's branch and open a DRAFT pull request with
        `gh pr create --draft`. Put the review in the PR body:
          {{ artifacts.review-b | inline }}
