# self-dev — dogfood graph for developing oh-my-graph with oh-my-graph.
#
#   dev ──▶ e2e ──▶ review-security ─┐
#    ▲          └─▶ review-style ────┴─▶ review-verdict ──▶ pr
#    └──────────── feedback (max 2) ──────────┘
#
# Takes an explicit `task` (unlike dev-review-pr.yaml, which assumes the branch
# already carries the task context). Opens a DRAFT PR so nothing lands unreviewed.
#
# It GATES on its reviews (#293): a FINDINGS: from either reviewer sends the
# work back to `dev` with the findings, instead of riding into the PR body. The
# gate is one fan-in node, `review-verdict`, because it has to be — see the
# comment above it. Price of the arc, legible from the file: the body is all
# five nodes up to and including `review-verdict`, so (1 + max) × 5 = 15 runs
# worst case, and 18 counting the retry `e2e` brings from its fragment (a retry
# is charged on top of its round, DESIGN.md "Feedback edges"). A run where both
# reviews come back CLEAN first time pays for exactly one extra node.
#
# Run (from a fresh feature branch):
#   git checkout -b feat/my-thing
#   oh-my-graph run graphs/self-dev.yaml --input repo="$PWD" --input task="what to build"
name: self-dev
version: "0.1"
inputs: [repo, task]
concurrency: 4
nodes:
  - id: dev
    type: claude-run
    cwd: "{{ inputs.repo }}"
    prompt: |
      You are on a feature branch of the oh-my-graph Go repo. Implement this task,
      keeping the diff focused and matching the existing style (DESIGN.md is the
      spec; English-only):
        {{ inputs.task }}
      os/exec belongs to the FOUR exec seams only — runner.ClaudeCLIRunner,
      verify.ShellVerifier, worktree.GitManager, browser.ExecOpener — and a fifth
      spawner needs an ADR before it lands; internal/invariants enforces this.
      Add or update tests. Choose a commit granularity that fits the work —
      one commit per refactoring unit for refactors, per file for sweeps, per
      feature slice for new code — and state your choice in the first commit
      message. Commit as you go: a node timeout must never lose finished work.
      Stage ONLY the files you created or modified for this task, by explicit
      path (`git add <path> ...`). Never `git add -A`, `git add .`, or
      `git add -u`: the working tree may hold untracked files that are not part
      of this task (assets someone dropped in, scratch output), and sweeping
      them into your commit is a bug.
      End every commit message with the trailer
      `Co-Authored-By: oh-my-graph <graphs@oh-my-graph.dev>` (the attribution
      convention in CONTRIBUTING.md).
      Your FINAL reply IS the verdict: this node's turn ends the moment you
      reply, so work you promise to do afterwards never happens. Never end on
      a plan to continue — report the state that is TRUE AS YOU REPLY. When
      the change is committed, START your reply with the bare word DONE —
      those four characters FIRST, no markdown emphasis (`**DONE**` is WRONG),
      no heading, no preamble — then a one-line summary of what you changed.
      Anything you need to qualify goes AFTER the verdict, never before it:
      a line of context ahead of the token fails this node even when the
      work is done.
      If it is not finished, do NOT write DONE: start with a bare BLOCKED and
      the current state.

      Review findings from the previous round follow — they are empty on the
      first pass. If present, fix every one before anything else, and note
      that the branch already carries the previous round's commits: amend the
      work, do not restart it.
      {{ feedback.review-verdict }}
    allowed_tools: [Read, Edit, Write, "Bash(git *)", "Bash(go *)"]
    permission_mode: dontAsk
    timeout: 1h  # the hang guard — generous, so real work is never killed mid-flight
    handoff: artifact
    # Anchored, markdown-tolerant (DESIGN.md "Verdict patterns"): without it,
    # an unfinished dev node passes and e2e resumes a half-done session.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*DONE\b' }

  # The proven gate/review shapes are fragments (ADR 0013): the prompt, the
  # grant and the evidence-grounded success_check live once, in
  # graphs/fragments/<name>.yaml, and only the per-graph spans are bound
  # here. `lint` still warns on e2e (handoff: session + retry) — that is
  # advisory and expected: a retried attempt starts cold instead of resuming
  # dev's session, and the fragment's prompt is written to survive exactly
  # that case.
  - id: e2e
    use: e2e-verify
    depends_on: [dev]
    cwd: "{{ inputs.repo }}"
    with:
      checks: |-
        run `make local` (build + test + vet).
        If the diff touches concurrency-sensitive code or its tests
        (internal/schedule, internal/runner, anything spawning goroutines or
        using channels), ALSO stress those packages —
        `go test <pkgs> -race -count=300` — because a flaky test passes a
        single run; determinism is the claim under test.
      verify_command: make local

  # The two reviews keep the fragments' either-verdict check: each one's job is
  # to judge, and `review-verdict` below is what gates on the judgment. They
  # still re-run every round — both sit inside the arc's body — and on a re-run
  # each fragment's prompt quotes {{ self.previous }}, the reviewer's own reply
  # from the round before, so it checks whether its earlier findings were
  # closed instead of reviewing the reworked diff as a stranger (#288). Empty on
  # the first pass; nothing to bind here.
  - id: review-security
    use: review-security
    depends_on: [e2e]
    cwd: "{{ inputs.repo }}"
    with:
      diff: the current branch's diff vs main
      evidence: "{{ artifacts.e2e | inline }}"

  - id: review-style
    use: review-style
    depends_on: [e2e]
    cwd: "{{ inputs.repo }}"
    with:
      diff: the current branch's diff vs main
      focus: Also check adherence to DESIGN.md's invariants (the four exec seams, env scrub, no Agent SDK).

  # The gate (#293). Gating is a PAIR — a success_check narrowed to the clean
  # verdict AND a `feedback:` arc back to the implementer (DESIGN.md "A review
  # gates only when its caller pairs a narrowed check with an arc";
  # graphs/fragments/gated-lane.yaml) — and here the pair cannot sit on either
  # review, for two load rules (ADR 0010):
  #   - rule 3, no side exit: an arc on one review has `e2e` in its body, and
  #     the sibling review depends on `e2e` from outside it;
  #   - rule 6, disjoint bodies: two arcs that both re-run `dev` share
  #     dev → e2e, so serializing the reviews does not help either.
  # So the reviews fan in to ONE declarer whose body holds them both: every node
  # on a path from `dev` to here. Its reply is the payload `dev` reads through
  # {{ feedback.review-verdict }}.
  #
  # The model's CLEAN is not taken on its word. `verify` is the engine reading
  # the two review artifacts itself (the filterless {{ artifacts.<id> }} is the
  # file's path, never its text): a reply that says CLEAN over a review that
  # did not fails here, and the command prints the open review, which is then
  # the payload `dev` reads (ADR 0016 §2). That is the ONLY round whose payload
  # is the command's output: a FINDINGS: reply fails result_matches before
  # `verify` runs, and then the payload is the reply itself — which is why the
  # prompt makes the reply carry the findings verbatim. The engine keeps only
  # the TAIL of verify output (4000 runes, internal/schedule maxEvidenceRunes),
  # so each review prints at most its first 1900 bytes: two long reviews both
  # survive the cut, each with its worst-first head intact. Its test is
  # TestSelfDevVerdictCommandJudgesTheReviewArtifacts.
  #
  # No `retry:` — a rejected verdict belongs to `dev` via the arc, never to a
  # second opinion on the same reviews. `max: 2`: a dogfood run has an operator
  # waiting on it, so it buys one more repair round than an unattended
  # `backlog-batch` lane does; an exhausted loop FAILs the run with the findings
  # nobody repaired, and no PR opens.
  - id: review-verdict
    type: claude-run
    depends_on: [review-security, review-style]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Two reviews of the current branch's diff follow. Do not review the diff
      yourself and do not add findings of your own: your only job is to say
      whether both reviewers came back clean.
        Security review: {{ artifacts.review-security | inline }}
        Style review:    {{ artifacts.review-style | inline }}

      Your FINAL reply IS the verdict. START it with exactly one of these two
      bare tokens, as the very FIRST characters, with no markdown emphasis
      (`**CLEAN**` is WRONG), no heading, no preamble:
        - CLEAN — BOTH reviews start with CLEAN.
        - FINDINGS: — either review starts with FINDINGS:. Follow the token
          with every finding from every review that raised one, verbatim,
          under a `Security:` or `Style:` label, worst first.
    allowed_tools: [Read]
    permission_mode: plan
    handoff: artifact
    success_check:
      exit_zero: true
      result_matches: '^[*_`\s]*CLEAN\b'
      verify:
        command: >-
          rc=0; for f in "{{ artifacts.review-security }}" "{{ artifacts.review-style }}";
          do if ! head -c 256 "$f" | tr -d '*_` \t\r\n' | grep -q '^CLEAN'; then
          head -c 1900 "$f"; echo; rc=1; fi; done; exit $rc
        timeout: 1m
    feedback: { rerun: dev, max: 2 }

  - id: pr
    use: pr-publish
    depends_on: [review-verdict]
    cwd: "{{ inputs.repo }}"
    with:
      publish: |-
        Push the current branch and open a DRAFT pull request with `gh pr create --draft`.
        Put both reviews in the PR body:
          Security review: {{ artifacts.review-security | inline }}
          Style review:    {{ artifacts.review-style | inline }}
