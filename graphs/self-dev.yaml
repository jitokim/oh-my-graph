# self-dev — dogfood graph for developing oh-my-graph with oh-my-graph.
#
#   dev ──▶ e2e ──▶ review-security ─┐
#               └─▶ review-style ────┴─▶ pr
#
# Takes an explicit `task` (unlike dev-review-pr.yaml, which assumes the branch
# already carries the task context). Opens a DRAFT PR so nothing lands unreviewed.
#
# Run (from a fresh feature branch):
#   git checkout -b feat/my-thing
#   oh-my-graph run graphs/self-dev.yaml --input repo="$PWD" --input task="what to build"
name: self-dev
version: "0.1"
inputs: [repo, task]
concurrency: 4
nodes:
  - id: dev
    type: claude-run
    cwd: "{{ inputs.repo }}"
    prompt: |
      You are on a feature branch of the oh-my-graph Go repo. Implement this task,
      keeping the diff focused and matching the existing style (DESIGN.md is the spec;
      the NodeRunner seam is the only os/exec touch point; English-only):
        {{ inputs.task }}
      Add or update tests. Choose a commit granularity that fits the work —
      one commit per refactoring unit for refactors, per file for sweeps, per
      feature slice for new code — and state your choice in the first commit
      message. Commit as you go: a node timeout must never lose finished work.
      Stage ONLY the files you created or modified for this task, by explicit
      path (`git add <path> ...`). Never `git add -A`, `git add .`, or
      `git add -u`: the working tree may hold untracked files that are not part
      of this task (assets someone dropped in, scratch output), and sweeping
      them into your commit is a bug.
      Reply with a one-line summary of what you changed.
    allowed_tools: [Read, Edit, Write, "Bash(git *)", "Bash(go *)"]
    permission_mode: dontAsk
    timeout: 1h  # the hang guard — generous, so real work is never killed mid-flight
    handoff: artifact
    success_check: { exit_zero: true }

  # `lint` still warns here (handoff: session + retry) — that is advisory and
  # expected: a retried attempt starts cold instead of resuming dev's session,
  # and the prompt below is written to survive exactly that case.
  - id: e2e
    type: claude-run
    depends_on: [dev]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Continue the work — or, on a retried attempt, start from the branch's
      committed state — and run `make local` (build + test + vet).
      If the diff touches concurrency-sensitive code or its tests
      (internal/schedule, internal/runner, anything spawning goroutines or
      using channels), ALSO stress those packages —
      `go test <pkgs> -race -count=300` — because a flaky test passes a
      single run; determinism is the claim under test. Report exactly PASS
      if everything succeeds, or FAIL with the failing step.
    allowed_tools: [Read, "Bash(make *)", "Bash(go *)", "Bash(git *)"]
    permission_mode: dontAsk
    handoff: session
    success_check: { exit_zero: true, result_matches: "^PASS" }
    retry: { max: 1, on: [nonzero_exit] }

  - id: review-security
    type: claude-run
    depends_on: [e2e]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Review the current branch's diff vs main for security issues (unsafe shell,
      secrets, unsafe exec, injection). e2e said: {{ artifacts.e2e | inline }}.
      Reply with a short bulleted list, or "no security issues found".
    allowed_tools: [Read, "Bash(git diff*)", "Bash(git log*)"]
    permission_mode: plan
    handoff: artifact
    success_check: { exit_zero: true }

  - id: review-style
    type: claude-run
    depends_on: [e2e]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Review the current branch's diff vs main for style, naming, simplicity, and
      adherence to DESIGN.md's invariants (NodeRunner seam, env scrub, no Agent SDK).
      If the diff adds or edits test doubles or concurrency tests, also verify:
      every synchronization field is actually wired (no dead channels, no
      wall-clock fallback arms — CONTRIBUTING's test-double rule), and no
      assertion is satisfiable by a record or node simply being absent.
      Reply with a short bulleted list, or "no style issues found".
    allowed_tools: [Read, "Bash(git diff*)", "Bash(git log*)"]
    permission_mode: plan
    handoff: artifact
    success_check: { exit_zero: true }

  - id: pr
    type: claude-run
    depends_on: [review-security, review-style]
    cwd: "{{ inputs.repo }}"
    prompt: |
      Push the current branch and open a DRAFT pull request with `gh pr create --draft`.
      Put both reviews in the PR body:
        Security review: {{ artifacts.review-security | inline }}
        Style review:    {{ artifacts.review-style | inline }}
      Reply with the PR URL.
    allowed_tools: [Read, "Bash(git *)", "Bash(gh *)"]
    permission_mode: dontAsk
    handoff: artifact
    success_check: { exit_zero: true }
