# review-loop — the minimal bounded review loop (ADR 0010): implement, then
# review; a failing review re-runs the implementation WITH its findings, at
# most twice, then fails for real.
#
#   impl ─▶ review ──(feedback: rerun impl, max 2)──▶ impl …
#
# This is the shape adr-driven-dev's round1→apply1→round2→apply2→round3
# chain hand-unrolls, as one declared arc: a clean first round costs two
# sessions instead of five nodes, a second (or third) round fires only when
# the review actually failed, and the findings flow into the re-run as
# {{ feedback.review }} — empty on the first pass by design.
#
# Cost, honestly: worst case (1 + max) × |body| = 3 × 2 = 6 claude sessions,
# each under its own budget_usd/timeout below. The ledger prices every round
# ("feedback round k/2" in the DETAIL column), so tune max against what the
# table shows you. Keep max small — 2, not 10.
#
# impl EDITS the repo you point it at, in place — and every fired round edits
# it again on top of the last, so run it against a clean, committed state:
# each round's changes stay inspectable (and revertible) with git. To keep
# your main checkout untouched, point --input repo= at a dedicated git
# worktree or clone instead (see "worktree" in README).
#
# Run:
#   oh-my-graph run graphs/review-loop.yaml \
#     --input repo=/path/to/your/repo \
#     --input task="what to implement or fix"

name: review-loop
version: 1
inputs: [repo, task]
concurrency: 1

nodes:
  - id: impl
    cwd: "{{ inputs.repo }}"
    prompt: |
      Implement this task: {{ inputs.task }}

      Work in small, verifiable steps and run the project's own tests before
      you finish. Your FINAL reply IS the verdict: this node's turn ends the
      moment you reply, so work you promise to do afterwards never happens.
      Never end on a plan to continue — report the state that is TRUE AS YOU
      REPLY. When the work is done and the tests are green, START your reply
      with the bare word DONE — those four characters FIRST, no markdown
      emphasis (`**DONE**` is WRONG), no heading, no preamble — then a short
      summary of what changed. Anything you need to qualify goes AFTER the
      verdict, never before it: a line of context ahead of the token fails
      this node even when the work is done. If it is not finished, do NOT
      write DONE: start with a bare BLOCKED and the current state.

      Reviewer feedback from the previous round follows — it is empty on the
      first pass. If present, address every point before anything else:
      {{ feedback.review }}
    allowed_tools: [Read, Edit, Write, Grep, Glob, "Bash(make *)", "Bash(go *)", "Bash(git *)"]
    permission_mode: dontAsk
    # The loop only makes sense over finished rounds: an impl that ends on
    # "I'll continue next" would otherwise be reviewed as if it were done, and
    # the review's findings would be about a half-written change. Anchored and
    # markdown-tolerant (DESIGN.md "Verdict patterns"). `exit_zero` is spelled
    # out because it is only implied by an ABSENT success_check: the moment a
    # node declares one, every predicate it wants is a predicate it must name.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*DONE\b' }
    budget_usd: 2.00
    timeout: 30m

  - id: review
    depends_on: [impl]
    cwd: "{{ inputs.repo }}"
    permission_mode: plan     # read-only: the reviewer judges, never edits
    # Named even though these are what a reviewer would reach for anyway:
    # `allowed_tools` is the node's own grant, not a hint, and a node that
    # omits it inherits whatever your Claude Code settings happen to
    # pre-authorise. A denial there is silent — the reply explains it in prose
    # and `result_matches` is free to pass on that prose — so the grant is
    # declared here rather than assumed. The two git reads match what the
    # shipped review fragments grant for the same job: this node reviews a
    # working tree, and a diff is how you read one.
    allowed_tools: [Read, Grep, Glob, "Bash(git diff*)", "Bash(git log*)"]
    prompt: |
      Review the working tree against this task: {{ inputs.task }}
      The implementer reported: {{ artifacts.impl | inline }}

      Judge correctness, tests, and scope. If the work is sound, START your
      reply with the bare words ship it — those seven characters, lowercase
      exactly as written, as the very FIRST of the reply, with no markdown
      emphasis (`**ship it**` is WRONG), no quotes, no heading, no
      backticks, no preamble — then one sentence of
      praise. Anything you need to qualify goes AFTER the verdict, never
      before it: a line of context ahead of the phrase fails this node even
      when the work is sound.
      Otherwise DO NOT say "ship it" — reply with a concise,
      numbered list of required fixes; that list is handed verbatim to the
      implementation re-run.
    # Anchored: a failing review that merely MENTIONS the verdict phrase
    # ("can't say ship it yet") must not read as a pass. Tolerant of leading
    # markdown emphasis, which a model adds unbidden even when told not to.
    # `exit_zero` spelled out for the same reason as impl's above.
    success_check: { exit_zero: true, result_matches: '^[*_`\s]*ship it\b' }
    feedback: { rerun: impl, max: 2 }
    budget_usd: 1.00
    timeout: 15m
