# CodeRabbit configuration.
# CodeRabbit review comments are advisory only — they do not block merges
# and do not replace human review.
# Schema reference: https://docs.coderabbit.ai/reference/yaml-template

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!**/*.md"
    - "!**/testdata/**"
    - "!**/*.lock"
  path_instructions:
    - path: "**/*.go"
      instructions: >
        Review for idiomatic Go, error handling, and test coverage.
        Flag missing tests for exported functions and unhandled errors.

chat:
  auto_reply: true
